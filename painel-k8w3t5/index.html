// --- Lista de busca (cliente, rede) no padrão do kit, no lugar da lista do navegador ---
const semAcentoKit = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function abrirListaKit(inp) {
  if (seletorKit.input === inp) { desenharListaKit(); return; }
  fecharSeletorKit();
  const el = document.createElement('div');
  el.className = 'kit-pop lista'; el.id = 'kitLista'; el.setAttribute('role', 'listbox');
  el.addEventListener('mousedown', e => e.preventDefault()); // o foco continua no campo
  seletorKit.el = el; seletorKit.input = inp; seletorKit.ativo = -1;
  inp.classList.add('aberto'); inp.setAttribute('aria-expanded', 'true'); inp.setAttribute('aria-controls', 'kitLista');
  document.body.appendChild(el);
  desenharListaKit();
}
function desenharListaKit() {
  const inp = seletorKit.input, el = seletorKit.el, dl = document.getElementById(inp.dataset.lista);
  const todas = dl ? [...dl.options].map(o => o.value) : [];
  const txt = inp.value.trim(), exato = todas.includes(txt);
  // Com um item já escolhido, mostra a lista inteira; digitando, filtra por todas as palavras (sem acento)
  const termos = exato ? [] : semAcentoKit(txt).split(/\s+/).filter(Boolean);
  const achadas = todas.filter(v => { const n = semAcentoKit(v); return termos.every(t => n.includes(t)); });
  const LIMITE = 60, mostrar = achadas.slice(0, LIMITE);
  seletorKit.itens = mostrar;
  if (seletorKit.ativo >= mostrar.length) seletorKit.ativo = mostrar.length - 1;
  el.innerHTML = `<div class="kit-lista">${mostrar.length
    ? mostrar.map((v, i) => `<button type="button" role="option" tabindex="-1" class="kit-item ${v === txt ? 'sel' : ''} ${i === seletorKit.ativo ? 'ativo' : ''}" data-i="${i}" aria-selected="${v === txt}">${esc(v)}</button>`).join('')
    : `<div class="kit-lista-nota">Nada encontrado para “${esc(txt)}”.</div>`}${achadas.length > LIMITE ? `<div class="kit-lista-nota">Mais ${achadas.length - LIMITE} resultado(s): continue digitando para filtrar.</div>` : ''}</div>`;
  el.style.width = Math.max(240, inp.getBoundingClientRect().width) + 'px';
  posicionarSeletorKit();
  const alvo = el.querySelector('.kit-item.ativo') || el.querySelector('.kit-item.sel');
  if (alvo) alvo.scrollIntoView({ block: 'nearest' });
}
function escolherListaKit(i) {
  const v = seletorKit.itens[i]; if (v == null) return;
  definirValorKit(v); fecharSeletorKit(true);
}
document.addEventListener('input', e => {
  if (!e.target.matches || !e.target.matches('input[data-lista]') || seletorKit.definindo) return;
  seletorKit.ativo = -1; abrirListaKit(e.target);
});
function posicionarSeletorKit() {
  const r = seletorKit.input.getBoundingClientRect(), el = seletorKit.el, h = el.offsetHeight, w = el.offsetWidth;
  let top = r.bottom + 6;
  if (top + h > innerHeight - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
  el.style.top = Math.max(8, top) + 'px';
  el.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
}
function definirValorKit(v) {
  const inp = seletorKit.input; inp.value = v;
  seletorKit.definindo = true;
  inp.dispatchEvent(new Event('input', { bubbles: true }));
  inp.dispatchEvent(new Event('change', { bubbles: true }));
  seletorKit.definindo = false;
}
function abrirSeletorKit(inp, peloTeclado) {
  fecharSeletorKit();
  const el = document.createElement('div');
  el.className = 'kit-pop'; el.setAttribute('role', 'dialog');
  el.setAttribute('aria-label', inp.type === 'date' ? 'Escolher data' : 'Escolher horário');
  seletorKit.el = el; seletorKit.input = inp;
  inp.classList.add('aberto');
  document.body.appendChild(el);
  if (inp.type === 'date') { seletorKit.mes = (inp.value || hoje()).slice(0, 8) + '01'; desenharCalendarioKit(peloTeclado ? (inp.value || hoje()) : null); }
  else desenharRelogioKit(peloTeclado);
  posicionarSeletorKit();
}
function desenharCalendarioKit(focarDia) {
  const el = seletorKit.el, sel = seletorKit.input.value, hj = hoje();
  const [a, m] = seletorKit.mes.split('-').map(Number), prim = new Date(a, m - 1, 1), ini = addDias(iso(prim), -prim.getDay());
  const alvo = focarDia || sel || hj;
  let dias = '';
  for (let i = 0; i < 42; i++) {
    const d = addDias(ini, i), doMes = +d.slice(5, 7) === m;
    if (i >= 35 && !doMes) break;
    dias += `<button type="button" class="kit-dia ${doMes ? '' : 'fora'} ${d === hj ? 'hoje' : ''} ${d === sel ? 'sel' : ''}" data-dia="${d}" tabindex="${d === alvo ? 0 : -1}" aria-label="${fmtData(d)}">${+d.slice(8)}</button>`;
  }
  el.innerHTML = `<div class="kit-cal-cab"><button type="button" class="kit-nav" data-mes="-1" aria-label="Mês anterior">${ICO.esq}</button><b>${MESES[m - 1]} ${a}</b><button type="button" class="kit-nav" data-mes="1" aria-label="Próximo mês">${ICO.dir}</button></div>
    <div class="kit-cal-grade">${DIAS_CURTOS.map(x => `<span>${x}</span>`).join('')}${dias}</div>
    <div class="kit-pop-rodape">${seletorKit.input.required ? '' : '<button type="button" class="kit-link" data-limpar="1">Limpar</button>'}<button type="button" class="kit-link" data-dia="${hj}">Hoje</button></div>`;
  if (focarDia) el.querySelector(`.kit-dia[data-dia="${focarDia}"]`)?.focus();
}
function desenharRelogioKit(focar) {
  const el = seletorKit.el, [h, m] = (seletorKit.input.value || '').split(':');
  const minutos = new Set(Array.from({ length: 12 }, (_, i) => String(i * 5).padStart(2, '0')));
  if (m) minutos.add(m);
  const col = (tipo, lista, atual) => `<div class="kit-col">${lista.map(v => `<button type="button" class="kit-op ${v === atual ? 'sel' : ''}" data-${tipo}="${v}">${v}</button>`).join('')}</div>`;
  el.innerHTML = `<div class="kit-rel-cab"><span>Hora</span><span>Min</span></div>
    <div class="kit-rel">${col('h', Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0')), h)}${col('m', [...minutos].sort(), m)}</div>`;
  el.querySelectorAll('.kit-col').forEach(c => { const s = c.querySelector('.sel'); if (s) c.scrollTop = s.offsetTop - c.offsetTop - c.clientHeight / 2 + s.offsetHeight / 2; });
  if (focar) (el.querySelector('.kit-op.sel') || el.querySelector('.kit-op')).focus();
}
document.addEventListener('click', e => {
  const lista = e.target.closest && e.target.closest('input[data-lista]');
  if (lista) { if (seletorKit.input !== lista) abrirListaKit(lista); return; }
  const inp = e.target.closest && e.target.closest('input[type=date], input[type=time]');
  if (inp && !inp.disabled && !inp.readOnly && usarSeletorKit()) {
    e.preventDefault();
    if (seletorKit.input !== inp) abrirSeletorKit(inp);
    return;
  }
  if (!seletorKit.el) return;
  if (!seletorKit.el.contains(e.target)) { fecharSeletorKit(); return; }
  e.stopPropagation();
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.i != null) escolherListaKit(+b.dataset.i);
  else if (b.dataset.mes) { seletorKit.mes = addMeses(seletorKit.mes, +b.dataset.mes); desenharCalendarioKit(); }
  else if (b.dataset.dia) { definirValorKit(b.dataset.dia); fecharSeletorKit(true); }
  else if (b.dataset.limpar) { definirValorKit(''); fecharSeletorKit(true); }
  else if (b.dataset.h) { definirValorKit(`${b.dataset.h}:${seletorKit.input.value.split(':')[1] || '00'}`); desenharRelogioKit(); }
  else if (b.dataset.m) { definirValorKit(`${seletorKit.input.value.split(':')[0] || '08'}:${b.dataset.m}`); fecharSeletorKit(true); }
}, true);
document.addEventListener('keydown', e => {
  // Lista de busca: setas andam pelos resultados, Enter escolhe, Esc/Tab fecham
  const campoLista = e.target.matches && e.target.matches('input[data-lista]') ? e.target : null;
  if (campoLista) {
    const aberta = seletorKit.input === campoLista;
    if (!aberta && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); abrirListaKit(campoLista); return; }
    if (!aberta) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const n = seletorKit.itens.length; if (!n) return;
      seletorKit.ativo = e.key === 'ArrowDown' ? (seletorKit.ativo + 1) % n : (seletorKit.ativo <= 0 ? n - 1 : seletorKit.ativo - 1);
      desenharListaKit(); return;
    }
    if (e.key === 'Enter') {
      const i = seletorKit.ativo >= 0 ? seletorKit.ativo : (seletorKit.itens.length === 1 ? 0 : -1);
      if (i >= 0) { e.preventDefault(); escolherListaKit(i); }
      return;
    }
    if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); fecharSeletorKit(true); return; }
    if (e.key === 'Tab') { fecharSeletorKit(); return; }
    return;
  }
  const inp = e.target.matches && e.target.matches('input[type=date], input[type=time]') ? e.target : null;
  if (inp && !seletorKit.el && usarSeletorKit() && (e.key === 'Enter' || (e.altKey && e.key === 'ArrowDown'))) { e.preventDefault(); abrirSeletorKit(inp, true); return; }
  if (!seletorKit.el) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); fecharSeletorKit(true); return; }
  if (e.key === 'Tab' && inp) { fecharSeletorKit(); return; }
  const dia = e.target.closest && e.target.closest('.kit-dia');
  const passo = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
  if (dia && passo) {
    e.preventDefault();
    const novo = addDias(dia.dataset.dia, passo);
    if (novo.slice(0, 7) !== seletorKit.mes.slice(0, 7)) seletorKit.mes = novo.slice(0, 8) + '01';
    desenharCalendarioKit(novo);
  }
  const op = e.target.closest && e.target.closest('.kit-op');
  if (op && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); (e.key === 'ArrowUp' ? op.previousElementSibling : op.nextElementSibling)?.focus(); }
}, true);
document.addEventListener('scroll', e => { if (seletorKit.el && !seletorKit.el.contains(e.target)) fecharSeletorKit(); }, true);
addEventListener('resize', () => fecharSeletorKit());

  let ultimoPeriodo = null;
  const marcarPeriodo = () => {
    const per = perDia();
    $('#tPerManha', w).textContent = `${per.manhaIni}–${per.manhaFim}`;
    const ini = $('#tInicio', w).value, fim = $('#tTermino', w).value;
    const igual = (a, b) => ini === a && fim === b;
    const atual = igual(per.manhaIni, per.manhaFim) ? 'manha' : igual(per.tardeIni, per.tardeFim) ? 'tarde' : igual(per.manhaIni, per.tardeFim) ? 'dia' : 'outro';
    $$('#tPeriodo button', w).forEach(b => b.setAttribute('aria-pressed', b.dataset.per === atual));
    ultimoPeriodo = atual;
  };
  $('#tPeriodo', w).addEventListener('click', e => {
    const b = e.target.closest('[data-per]'); if (!b) return;
    const per = perDia();
    const faixa = { manha: [per.manhaIni, per.manhaFim], tarde: [per.tardeIni, per.tardeFim], dia: [per.manhaIni, per.tardeFim] }[b.dataset.per];
    if (faixa) { $('#tInicio', w).value = faixa[0]; $('#tTermino', w).value = faixa[1]; }
    else { $('#tInicio', w).focus(); }
    marcarPeriodo(); atualizar();
  });
  const atualizar = () => { atualizarInfoTarefa(w, orig, rotulos); marcarPeriodo(); };
  // Data: espera o "change" para manter o período escolhido (terça/quinta mudam o início da manhã)
  w.addEventListener('input', e => { if (e.target.id !== 'tData') atualizar(); });
  w.addEventListener('change', e => {
    if (e.target.closest('.chips')) desenharRdv();
    if (e.target.id === 'tData' && ['manha', 'dia'].includes(ultimoPeriodo)) $(`#tPeriodo [data-per="${ultimoPeriodo}"]`, w).click();
    atualizar();
  });
  const rep = $('#tRep', w);
  if (rep) rep.addEventListener('change', () => {
    const qtd = $('#tRepN', w);
    qtd.disabled = !rep.value;
    // Sugestão de quantidade: uma semana de trabalho (todo dia), um mês (semanal) ou um trimestre (mensal)
    if (rep.value) qtd.value = { diaria: db.config.mostrarDomingo ? 7 : 6, semanal: 4, mensal: 3 }[rep.value];
  });
  $('#formTarefa', w).addEventListener('submit', e => { e.preventDefault(); salvarTarefa(w, w._fechar, orig, rotulos); });
  $('#tNovoCliente', w).addEventListener('click', () => abrirCliente(null, novo => {
    const r = nomeCliente(novo, true);
    rotulos.set(r, novo.id);
    $('#dlClientes', w).insertAdjacentHTML('beforeend', `<option value="${esc(r)}"></option>`);
    $('#tCliente', w).value = r; atualizar();
  }));
  desenharRdv();
  atualizar();
}

// Lê o formulário da tarefa (usado pela validação, alertas ao vivo e salvamento)
function lerFormTarefa(w, rotulos) {
  const tecnicoIds = $$('.chips input:checked', w).map(i => i.value);
  const rdv = {};
  $$('[data-rdv]', w).forEach(i => { if (tecnicoIds.includes(i.dataset.rdv)) rdv[i.dataset.rdv] = lerValor(i.value); });
  return {
    clienteId: rotulos.get($('#tCliente', w).value.trim()) || '',
    tecnicoIds,
    data: $('#tData', w).value, inicio: $('#tInicio', w).value,
    // Início e término são informados; a duração da tarefa é calculada (término − início − almoço − deslocamento)
    duracaoMin: $('#tInicio', w).value && $('#tTermino', w).value ? hm2min($('#tTermino', w).value) - hm2min($('#tInicio', w).value) : NaN,
    deslocMin: $('#tDesloc', w).value.trim() ? lerDuracao($('#tDesloc', w).value) : 0,
    tipo: $('#tTipo', w).value, prioridade: $('#tPrio', w).value, status: $('#tStatus', w).value,
    descricao: $('#tDesc', w).value.trim(), auvo: $('#tAuvo', w).value.trim(),
    veiculo: lerCampoVeiculo(w, 'tVeic'),
    rdv
  };
}

function atualizarInfoTarefa(w, orig, rotulos) {
  const d = lerFormTarefa(w, rotulos);
  const almocoTarefa = d.duracaoMin - trabalhoMin(d) - deslocMin(d);
  const fimEl = $('#tFim', w);
  fimEl.classList.toggle('txt-vermelho', d.duracaoMin > 0 && !(trabalhoMin(d) > 0));
  fimEl.textContent = !(d.duracaoMin > 0) ? (d.inicio && $('#tTermino', w).value ? 'O término precisa ser depois do início.' : '')
    : `Duração: ${fmtDur(trabalhoMin(d))} h de tarefa${deslocMin(d) || almocoTarefa > 0 ? ` (${[fmtDur(d.duracaoMin) + ' no total', almocoTarefa > 0 ? fmtDur(almocoTarefa) + ' de almoço' : '', deslocMin(d) ? fmtDur(deslocMin(d)) + ' de deslocamento' : ''].filter(Boolean).join(' − ')})` : ''}`;
  // Franquia da loja escolhida
  const c = cliente(d.clienteId), fr = $('#tFranquia', w);
  if (c && c.situacao === 'contrato' && c.franquiaHoras && d.data) {
    const ym = d.data.slice(0, 7);
    const base = franquiaLoja(c.id, ym);
    const atual = orig && orig.clienteId === c.id && orig.data.startsWith(ym) && ativa(orig) ? horasTecnico(orig) : 0;
    const nova = d.status !== 'cancelada' && d.duracaoMin > 0 ? trabalhoMin(d) * Math.max(1, d.tecnicoIds.length) : 0;
    const total = base.planejado - atual + nova, pct = total / base.franquia * 100;
    const faixa = pct > 100 ? 'vermelho' : pct > 80 ? 'amarelo' : 'verde';
    fr.innerHTML = `<div class="info-box" style="margin-top:6px">Loja com contrato · franquia ${fmtDur(base.franquia)} h/mês · planejado em ${nomeMes(ym)} com esta tarefa: <b class="txt-${faixa}">${fmtDur(total)} h (${pct.toFixed(0)}%)</b></div>`;
  } else if (c) {
    fr.innerHTML = `<div class="info-box" style="margin-top:6px">${c.situacao === 'contrato' ? 'Loja com contrato (franquia não definida)' : 'Cliente sem contrato'}${c.cidade ? ' · ' + esc(c.cidade) : ''}</div>`;
  } else fr.innerHTML = '';
  // Conflitos, ausências, veículo e carga ao vivo
  const msgs = [];
  if (d.status !== 'cancelada' && d.duracaoMin > 0 && d.inicio && d.data) {
    const ini = hm2min(d.inicio), fim = ini + d.duracaoMin;
    d.tecnicoIds.forEach(tid => {
      const nome = esc(tecnico(tid)?.nome);
      const aus = ausenciaDe(tid, d.data);
      if (aus) msgs.push(`${nome} está de ${nomeAusencia(aus).toLowerCase()} em ${fmtData(d.data)}${aus.obs ? ' (' + esc(aus.obs) + ')' : ''}.`);
      const outras = db.tarefas.filter(x => ativa(x) && x.data === d.data && x.tecnicoIds.includes(tid) && (!orig || x.id !== orig.id));
      outras.filter(x => inicioMin(x) < fim && ini < fimMin(x)).forEach(x => msgs.push(`Conflito: ${nome} já tem ${esc(nomeCliente(cliente(x.clienteId)))} das ${x.inicio} às ${min2hm(fimMin(x))}.`));
      const carga = outras.reduce((s, x) => s + trabalhoMin(x), 0) + trabalhoMin(d);
      if (carga > limiteMin()) msgs.push(`Carga: ${nome} ficará com ${fmtDur(carga)} h neste dia (limite ${fmtDur(limiteMin())} h).`);
    });
    if (d.veiculo) {
      db.tarefas.filter(x => ativa(x) && x.data === d.data && (x.veiculo || '').toUpperCase() === d.veiculo && (!orig || x.id !== orig.id)
        && !x.tecnicoIds.some(id => d.tecnicoIds.includes(id)) && inicioMin(x) < fim && ini < fimMin(x))
        .forEach(x => msgs.push(`Veículo ${esc(d.veiculo)} já está em ${esc(nomeCliente(cliente(x.clienteId)))} das ${x.inicio} às ${min2hm(fimMin(x))} com ${esc(x.tecnicoIds.map(id => tecnico(id)?.nome).filter(Boolean).join(', ') || 'outra equipe')}.`));
    }
  }
  if (Object.values(d.rdv).some(v => Number.isNaN(v))) msgs.push('RDV inválido: use apenas números, ex.: 350 ou 350,00.');
  $('#tConflito', w).innerHTML = msgs.length ? `<div class="info-box erro">${msgs.map(m => '⚠ ' + m).join('<br>')}<br><span style="font-weight:normal">Você pode salvar mesmo assim; o alerta continuará visível na agenda.</span></div>` : '';
}

function salvarTarefa(w, fechar, orig, rotulos) {
  const d = lerFormTarefa(w, rotulos);
  const erros = [];
  if (!d.clienteId) erros.push('Escolha um cliente da lista (ou cadastre um novo).');
  if (!d.data) erros.push('Informe a data.');
  if (!d.inicio) erros.push('Informe a hora de início.');
  if (!$('#tTermino', w).value) erros.push('Informe a hora de término.');
  else if (!(d.duracaoMin > 0)) erros.push('A hora de término precisa ser depois da hora de início.');
  else if (!(d.deslocMin >= 0)) erros.push('Deslocamento inválido. Use hh:mm, por exemplo 1:00.');
  else if (!(trabalhoMin(d) > 0)) erros.push('Com o almoço e o deslocamento, não sobra tempo de tarefa entre o início e o término.');
  if (Object.values(d.rdv).some(v => Number.isNaN(v))) erros.push('RDV inválido. Use apenas números, por exemplo 350 ou 350,00.');
  if (erros.length) { $('#tConflito', w).innerHTML = `<div class="info-box erro">${erros.join('<br>')}</div>`; return; }
  // Remove RDV zerado e guarda placas novas na lista de veículos
  Object.keys(d.rdv).forEach(k => { if (!d.rdv[k]) delete d.rdv[k]; });
  if (d.veiculo && !(db.config.veiculos || []).includes(d.veiculo)) (db.config.veiculos ||= []).push(d.veiculo);
  if (orig) {
    Object.assign(tarefa(orig.id) || orig, d);
    toast('Tarefa atualizada', 'ok');
  } else {
    const rep = $('#tRep', w)?.value, n = rep ? Math.min(Math.max(+$('#tRepN', w).value || 1, 1), 52) : 1;
    const recorrencia = rep ? uid() : undefined;
    // "Todo dia" usa só os dias que aparecem na agenda (pula domingo, se estiver oculto) e pula feriados gerais
    const datas = [];
    if (rep === 'diaria') {
      for (let dia = d.data, guarda = 0; datas.length < n && guarda < 400; dia = addDias(dia, 1), guarda++) {
        if (diaSemana(dia) === 0 && !db.config.mostrarDomingo) continue;
        if (dia !== d.data && feriadoGeral(dia)) continue;
        datas.push(dia);
      }
    } else for (let i = 0; i < n; i++) datas.push(rep === 'semanal' ? addDias(d.data, 7 * i) : rep === 'mensal' ? addMeses(d.data, i) : d.data);
    datas.forEach(data => { const nova = { ...d, tecnicoIds: [...d.tecnicoIds], rdv: { ...d.rdv }, id: uid(), data, recorrencia }; ajustarInicioAoDia(nova, d.data, data); db.tarefas.push(nova); });
    toast(datas.length > 1 ? `${datas.length} tarefas agendadas (${{ diaria: 'todo dia', semanal: 'toda semana', mensal: 'todo mês' }[rep]}) até ${fmtData(datas[datas.length - 1])}` : 'Tarefa agendada', 'ok');
  }
  salvar(); fechar();
  // Leva a agenda para a semana da tarefa, se estiver em outra
  if (!diasDaSemana().includes(d.data) && segundaDe(d.data) !== ui.semana && ui.aba === 'agenda') { ui.semana = segundaDe(d.data); ui.dia = d.data; }
  render();
}

/* ---------- Modal de FOLGA / FÉRIAS / FERIADO ---------- */
function abrirAusencia(id, preset = {}) {
  const orig = id ? db.ausencias.find(a => a.id === id) : null;
  const a = orig || { tipo: 'folga', inicio: preset.dia || (diasDaSemana().includes(hoje()) ? hoje() : ui.semana), fim: '', todos: false, tecnicoIds: preset.tec ? [preset.tec] : [], obs: '' };
  const tecs = db.tecnicos.filter(x => x.ativo !== false || a.tecnicoIds.includes(x.id)).sort((x, y) => x.nome.localeCompare(y.nome, 'pt-BR'));
  const corpo = `<form id="formAus" class="form-grade" autocomplete="off">
    <div class="campo c4"><label for="aTipo">Tipo</label><select id="aTipo">${AUSENCIAS.map(x => `<option value="${x.id}" ${x.id === a.tipo ? 'selected' : ''}>${x.nome}</option>`).join('')}</select></div>
    <div class="campo c4"><label for="aIni">De *</label><input type="date" id="aIni" value="${a.inicio}" required></div>
    <div class="campo c4"><label for="aFim">Até</label><input type="date" id="aFim" value="${a.fim || a.inicio}"><small>Para um dia só, repita a data.</small></div>
    <div class="campo c12"><label class="check"><input type="checkbox" id="aTodos" ${a.todos ? 'checked' : ''}> Vale para todos os técnicos (ex.: feriado)</label></div>
    <div class="campo c12" id="aTecsCampo"><span class="rotulo">Técnico(s)</span>
      <div class="chips" id="aTecs">${tecs.map(x => `<label class="chip" style="--cor:${x.cor}"><input type="checkbox" value="${x.id}" ${a.tecnicoIds.includes(x.id) ? 'checked' : ''}><span class="avatar" style="background:${x.cor};width:22px;height:22px;font-size:9px">${esc(iniciais(x.nome))}</span>${esc(x.nome)}</label>`).join('')}</div></div>
    <div class="campo c12"><label for="aObs">Observação</label><input type="text" id="aObs" value="${esc(a.obs)}" placeholder="Ex.: Nossa Senhora Aparecida; compensação de horas"></div>
    <div class="c12" id="aInfo"></div>
  </form>`;
  const salvarAus = (w, f) => {
    const dados = { tipo: $('#aTipo', w).value, inicio: $('#aIni', w).value, fim: $('#aFim', w).value || $('#aIni', w).value, todos: $('#aTodos', w).checked, tecnicoIds: $$('#aTecs input:checked', w).map(i => i.value), obs: $('#aObs', w).value.trim() };
    const erros = [];
    if (!dados.inicio) erros.push('Informe a data inicial.');
    if (dados.fim < dados.inicio) erros.push('A data final não pode ser antes da inicial.');
    if (!dados.todos && !dados.tecnicoIds.length) erros.push('Escolha ao menos um técnico ou marque “todos os técnicos”.');
    if (erros.length) { $('#aInfo', w).innerHTML = `<div class="info-box erro">${erros.join('<br>')}</div>`; return; }
    if (dados.todos) dados.tecnicoIds = [];
    if (orig) Object.assign(db.ausencias.find(x => x.id === orig.id) || orig, dados); else db.ausencias.push({ id: uid(), ...dados });
    salvar(); f(); render();
    const n = db.tarefas.filter(t => ativa(t) && t.data >= dados.inicio && t.data <= dados.fim && (dados.todos ? t.tecnicoIds.length : t.tecnicoIds.some(x => dados.tecnicoIds.includes(x)))).length;
    toast(n ? `${nomeAusencia(dados)} salva — ${n} tarefa(s) nesse período precisam ser revistas` : `${nomeAusencia(dados)} salva`, n ? 'erro' : 'ok');
  };
  const botoes = [];
  if (orig) botoes.push({ texto: 'Excluir', classe: 'btn-texto perigo', esquerda: true, acao: async (w, f) => { if (await confirmar(`Excluir ${nomeAusencia(orig).toLowerCase()} de ${fmtData(orig.inicio)}${orig.fim !== orig.inicio ? ' a ' + fmtData(orig.fim) : ''}?`, { titulo: 'Excluir', ok: 'Excluir', perigo: true })) { db.ausencias = db.ausencias.filter(x => x.id !== orig.id); salvar(); f(); render(); toast('Excluído'); } } });
  botoes.push({ texto: 'Cancelar', acao: (w, f) => f() });
  botoes.push({ texto: orig ? 'Salvar alterações' : 'Salvar', classe: 'btn-prim', acao: salvarAus });
  const w = abrirModal({ titulo: orig ? 'Editar folga / férias / feriado' : 'Folga, férias ou feriado', corpo, botoes, largura: 640 });
  const alternar = () => { $('#aTecsCampo', w).style.display = $('#aTodos', w).checked ? 'none' : ''; };
  $('#aTodos', w).addEventListener('change', alternar);
  $('#aTipo', w).addEventListener('change', () => { if ($('#aTipo', w).value === 'feriado' && !orig) { $('#aTodos', w).checked = true; alternar(); } });
  $('#aIni', w).addEventListener('change', () => { if (!$('#aFim', w).value || $('#aFim', w).value < $('#aIni', w).value) $('#aFim', w).value = $('#aIni', w).value; });
  $('#formAus', w).addEventListener('submit', e => { e.preventDefault(); salvarAus(w, w._fechar); });
  alternar();
}

/* ---------- Modal de CLIENTE ---------- */
function abrirCliente(id, aoSalvar) {
  const orig = id ? cliente(id) : null;
  const c = orig || { cliente: '', loja: '', endereco: '', cidade: '', contato: '', telefone: '', situacao: 'sem', franquiaHoras: null, obs: '', codigoAuvo: '' };
  const redes = [...new Set(db.clientes.map(x => x.cliente))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const corpo = `<form id="formCliente" class="form-grade" autocomplete="off">
    <div class="campo c6"><label for="cRede">Cliente (rede) *</label><input type="text" id="cRede" data-lista="dlRedes" role="combobox" aria-autocomplete="list" aria-expanded="false" value="${esc(c.cliente)}" required placeholder="Ex.: Festval/Beal"><datalist id="dlRedes">${redes.map(r => `<option value="${esc(r)}"></option>`).join('')}</datalist></div>
    <div class="campo c6"><label for="cLoja">Loja / unidade</label><input type="text" id="cLoja" value="${esc(c.loja)}" placeholder="Ex.: Centro"></div>
    <div class="campo c8"><label for="cEnd">Endereço</label><input type="text" id="cEnd" value="${esc(c.endereco)}"></div>
    <div class="campo c4"><label for="cCid">Cidade/UF</label><input type="text" id="cCid" value="${esc(c.cidade)}" placeholder="Cascavel/PR"></div>
    <div class="campo c6"><label for="cCont">Contato</label><input type="text" id="cCont" value="${esc(c.contato)}"></div>
    <div class="campo c6"><label for="cTel">Telefone</label><input type="tel" id="cTel" value="${esc(c.telefone)}"></div>
    <div class="campo c6"><label for="cSit">Situação contratual</label><select id="cSit">${SITUACOES.map(s => `<option value="${s.id}" ${c.situacao === s.id ? 'selected' : ''}>${s.nome}</option>`).join('')}</select></div>
    <div class="campo c6" id="cFrCampo"><label for="cFr">Franquia mensal de horas (desta loja)</label><input type="text" id="cFr" value="${c.franquiaHoras ? fmtDur(c.franquiaHoras * 60) : ''}" placeholder="Ex.: 36:00" inputmode="numeric"></div>
    <div class="campo c12"><label for="cObs">Observações</label><textarea id="cObs">${esc(c.obs)}</textarea></div>
    ${c.codigoAuvo ? `<div class="c12" style="font-size:12px;color:var(--cinza)">Código do cliente no Auvo: ${esc(c.codigoAuvo)}</div>` : ''}
    <div class="c12" id="cErro"></div>
  </form>`;
  const w = abrirModal({
    titulo: orig ? 'Editar cliente' : 'Novo cliente', corpo, largura: 680, botoes: [
      { texto: 'Cancelar', acao: (w, f) => f() },
      { texto: orig ? 'Salvar alterações' : 'Cadastrar cliente', classe: 'btn-prim', acao: (w, f) => salvarCliente(w, f, orig, aoSalvar) }
    ]
  });
  const sit = $('#cSit', w), alternar = () => $('#cFrCampo', w).style.visibility = sit.value === 'contrato' ? 'visible' : 'hidden';
  sit.addEventListener('change', alternar); alternar();
  $('#formCliente', w).addEventListener('submit', e => { e.preventDefault(); salvarCliente(w, w._fechar, orig, aoSalvar); });
}

function salvarCliente(w, fechar, orig, aoSalvar) {
  const v = id => $(id, w).value.trim();
  const dados = { cliente: v('#cRede'), loja: v('#cLoja'), endereco: v('#cEnd'), cidade: v('#cCid'), contato: v('#cCont'), telefone: v('#cTel'), situacao: v('#cSit'), obs: v('#cObs') };
  const fr = v('#cFr');
  const frMin = fr ? lerDuracao(fr) : 0;
  if (!dados.cliente) { $('#cErro', w).innerHTML = '<div class="info-box erro">Informe o nome do cliente.</div>'; return; }
  if (dados.situacao === 'contrato' && fr && !(frMin > 0)) { $('#cErro', w).innerHTML = '<div class="info-box erro">Franquia inválida. Use horas, ex.: 36 ou 36:00.</div>'; return; }
  const dup = db.clientes.find(x => x !== orig && semAcento(x.cliente) === semAcento(dados.cliente) && semAcento(x.loja) === semAcento(dados.loja));
  if (dup) { $('#cErro', w).innerHTML = '<div class="info-box erro">Já existe um cliente com esta rede e loja.</div>'; return; }
  dados.franquiaHoras = dados.situacao === 'contrato' && frMin > 0 ? +(frMin / 60).toFixed(2) : null;
  let c;
  if (orig) { c = cliente(orig.id) || orig; Object.assign(c, dados); toast('Cliente atualizado', 'ok'); }
  else { c = { id: uid(), codigoAuvo: '', ...dados }; db.clientes.push(c); toast('Cliente cadastrado', 'ok'); }
  salvar(); fechar(); render();
  aoSalvar && aoSalvar(c);
}

/* ---------- Modal de TÉCNICO ---------- */
function abrirTecnico(id) {
  const orig = id ? tecnico(id) : null;
  const usadas = new Set(db.tecnicos.map(t => t.cor));
  const t = orig || { nome: '', cor: CORES_TECNICO.find(c => !usadas.has(c)) || CORES_TECNICO[db.tecnicos.length % CORES_TECNICO.length], telefone: '', ativo: true };
  const corpo = `<form id="formTec" class="form-grade" autocomplete="off">
    <div class="campo c12"><label for="tecNome">Nome *</label><input type="text" id="tecNome" value="${esc(t.nome)}" required></div>
    <div class="campo c12"><span class="rotulo">Cor de identificação na agenda</span>
      <div class="paleta" id="tecPaleta">${CORES_TECNICO.map(c => `<button type="button" style="background:${c}" data-cor="${c}" aria-label="Cor ${c}" aria-pressed="${c === t.cor}"></button>`).join('')}<input type="color" id="tecCor" value="${t.cor}" aria-label="Outra cor"></div></div>
    <div class="campo c6"><label for="tecTel">Telefone</label><input type="tel" id="tecTel" value="${esc(t.telefone)}"></div>
    <div class="campo c6" style="align-self:end"><label class="check"><input type="checkbox" id="tecAtivo" ${t.ativo !== false ? 'checked' : ''}> Ativo (aparece na agenda)</label></div>
    <div class="c12" id="tecErro"></div>
  </form>`;
  const salvarTec = (w, f) => {
    const nome = $('#tecNome', w).value.trim();
    if (!nome) { $('#tecErro', w).innerHTML = '<div class="info-box erro">Informe o nome do técnico.</div>'; return; }
    const dados = { nome, cor: $('#tecCor', w).value, telefone: $('#tecTel', w).value.trim(), ativo: $('#tecAtivo', w).checked };
    if (orig) Object.assign(tecnico(orig.id) || orig, dados); else db.tecnicos.push({ id: uid(), ...dados });
    salvar(); f(); render(); toast(orig ? 'Técnico atualizado' : 'Técnico cadastrado', 'ok');
  };
  const w = abrirModal({ titulo: orig ? 'Editar técnico' : 'Novo técnico', corpo, largura: 520, botoes: [{ texto: 'Cancelar', acao: (w, f) => f() }, { texto: orig ? 'Salvar alterações' : 'Cadastrar técnico', classe: 'btn-prim', acao: salvarTec }] });
  $('#tecPaleta', w).addEventListener('click', e => {
    const b = e.target.closest('[data-cor]'); if (!b) return;

  });
  $('#formTec', w).addEventListener('submit', e => { e.preventDefault(); salvarTec(w, w._fechar); });
}

/* ======================= 7. APRESENTAÇÃO E IMPRESSÃO ======================= */
const apres = { modo: 'tecnico', i: 0, slides: [] };

function abrirApresentacao(modo = apres.modo) {
  apres.modo = modo;
  const lista = tarefasDaSemana();
  const tecs = tecnicosVisiveis(lista);
  apres.slides = [{ tipo: 'resumo' }];
  if (modo === 'tecnico') {
    tecs.forEach(t => apres.slides.push({ tipo: 'tecnico', tec: t }));
    if (lista.some(t => !t.tecnicoIds.length)) apres.slides.push({ tipo: 'tecnico', tec: null });
  } else diasDaSemana().forEach(d => apres.slides.push({ tipo: 'dia', dia: d }));
  apres.i = Math.min(apres.i, apres.slides.length - 1);
  const el = $('#apresentacao');
  el.hidden = false;
  renderSlide();
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => { });
}
function fecharApresentacao() {
  $('#apresentacao').hidden = true;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => { });
}
function moverSlide(n) { apres.i = Math.max(0, Math.min(apres.slides.length - 1, apres.i + n)); renderSlide(); }

function renderSlide() {
  const s = apres.slides[apres.i], conf = calcularConflitos(), lista = tarefasDaSemana(), dias = diasDaSemana(), hj = hoje();

  let titulo = '', sub = '', corpo = '';
  if (s.tipo === 'resumo') {
    titulo = 'Agenda da semana';
    sub = `${fmtData(dias[0])} a ${fmtData(dias[dias.length - 1])}${filtroAtivo() ? ' · <b>com filtros</b>' : ''}`;
    const al = alertasSemana(conf);
    corpo = `<div class="ap-resumo">${htmlIndicadores(indicadores(lista, conf))}${al.length ? `<div class="card alertas"><ul>${al.map(a => `<li class="${a.tipo === 'aviso' ? 'amarelo' : ''}">${ICO.alerta}<span>${a.texto}</span></li>`).join('')}</ul></div>` : `<div class="ap-vazio" style="padding:30px">${ICO.check.replace('<svg', '<svg width="34" height="34" style="vertical-align:middle;color:var(--verde)"')} Sem conflitos de horário nem excesso de carga nesta semana.</div>`}</div>`;
  } else if (s.tipo === 'tecnico') {

    const doTec = lista.filter(t => tec ? t.tecnicoIds.includes(id) : !t.tecnicoIds.length);
    const total = doTec.filter(ativa).reduce((a, t) => a + trabalhoMin(t), 0);

    titulo = tec ? esc(tec.nome) : 'Tarefas sem técnico';
    const rdvSem = tec ? doTec.filter(ativa).reduce((a, t) => a + rdvTec(t, id), 0) : 0;
    sub = tec ? `<b class="${excesso ? 'excesso' : ''}">${fmtDur(total)} h</b> planejadas · ${doTec.filter(ativa).length} tarefa(s)${rdvSem ? ` · RDV <b>${fmtBRL(rdvSem)}</b>` : ''}` : `${doTec.length} tarefa(s) aguardando responsável`;

// Valida o backup ANTES de tocar nos dados atuais
function validarBackup(o) {
  const erro = m => { throw new Error(m); };
  if (!o || typeof o !== 'object' || Array.isArray(o)) erro('O arquivo não contém um backup.');
  if (o.app !== 'agenda-redefrigor') erro('Este arquivo não é um backup da Agenda Redefrigor.');
  ['clientes', 'tecnicos', 'tarefas'].forEach(k => Array.isArray(o[k]) || erro(`A lista "${k}" está ausente ou corrompida.`));
  if (!o.config || !Array.isArray(o.config.tipos)) erro('As configurações estão ausentes ou corrompidas.');
  o.clientes.forEach((c, i) => (c && c.id && typeof c.cliente === 'string') || erro(`Cliente nº ${i + 1} inválido.`));
  o.tecnicos.forEach((t, i) => (t && t.id && typeof t.nome === 'string') || erro(`Técnico nº ${i + 1} inválido.`));
  o.tarefas.forEach((t, i) => {
    const ok = t && t.id && /^\d{4}-\d{2}-\d{2}$/.test(t.data) && /^\d{2}:\d{2}$/.test(t.inicio) && Number.isFinite(t.duracaoMin) && t.duracaoMin > 0 && Array.isArray(t.tecnicoIds);
    ok || erro(`Tarefa nº ${i + 1} inválida (data, horário ou duração).`);
  });
  // Backups antigos não têm folgas/férias: tudo bem; se tiver, precisa ser válido
  if (o.ausencias !== undefined) {
    Array.isArray(o.ausencias) || erro('A lista de folgas/férias está corrompida.');
    o.ausencias.forEach((a, i) => (a && a.id && /^\d{4}-\d{2}-\d{2}$/.test(a.inicio) && /^\d{4}-\d{2}-\d{2}$/.test(a.fim) && a.fim >= a.inicio) || erro(`Folga/férias nº ${i + 1} inválida.`));
  }
  return true;
}

async function importarBackup(arquivo) {
  let o;
  try { o = JSON.parse(await arquivo.text()); validarBackup(o); }
  catch (e) { avisar(`<b>Backup rejeitado.</b> ${esc(e instanceof SyntaxError ? 'O arquivo não é um JSON válido.' : e.message)}<br><br>Nenhum dado atual foi alterado.`, 'Importação cancelada'); return; }
  const ok = await confirmar(`Substituir <b>todos</b> os dados atuais pelo backup de ${o.exportadoEm ? fmtData(iso(new Date(o.exportadoEm))) : 'data desconhecida'}?<br><br>Backup: ${o.clientes.length} clientes, ${o.tecnicos.length} técnicos, ${o.tarefas.length} tarefas.<br>Atual: ${db.clientes.length} clientes, ${db.tecnicos.length} técnicos, ${db.tarefas.length} tarefas.`, { titulo: 'Importar backup', ok: 'Substituir dados', perigo: true });
  if (!ok) return;
  db = normalizarDb(o);
  db.meta.clientesAuvoCarregados = true;
  db.meta.tecnicosAuvoCarregados = true;
  if (!Array.isArray(db.meta.tecnicosAuvoVistos)) db.meta.tecnicosAuvoVistos = TECNICOS_AUVO.map(t => t.codigoAuvo);
  salvar(); render(); toast('Backup importado', 'ok');
}

// --- Leitura de CSV ---
async function lerTextoArquivo(arquivo) {
  const buf = await arquivo.arrayBuffer();
  let txt = new TextDecoder('utf-8').decode(buf);
  if (txt.includes('�')) txt = new TextDecoder('windows-1252').decode(buf); // CSV salvo pelo Excel
  return txt.replace(/^﻿/, '');
}
function parseCSV(txt) {
  const prim = txt.split('\n')[0];
  const sep = (prim.match(/;/g) || []).length >= (prim.match(/,/g) || []).length ? ';' : ',';
  const linhas = []; let campo = '', linha = [], aspas = false;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (aspas) { if (ch === '"') { if (txt[i + 1] === '"') { campo += '"'; i++; } else aspas = false; } else campo += ch; }
    else if (ch === '"') aspas = true;
    else if (ch === sep) { linha.push(campo); campo = ''; }
    else if (ch === '\n') { linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
    else if (ch !== '\r') campo += ch;
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas.filter(l => l.some(c => String(c).trim()));
}

// --- Leitura de Excel (.xlsx) sem bibliotecas: ZIP + XML com DecompressionStream ---
async function lerXlsx(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65558); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('Arquivo .xlsx inválido.');
  const arqs = {}; let p = dv.getUint32(eocd + 16, true);
  for (let k = 0, n = dv.getUint16(eocd + 10, true); k < n; k++) {
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    arqs[td.decode(u8.subarray(p + 46, p + 46 + nl))] = { metodo: dv.getUint16(p + 10, true), tam: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true) };
    p += 46 + nl + xl + cl;
  }
  const ler = async nome => {
    const a = arqs[nome]; if (!a) return null;
    const ini = a.off + 30 + dv.getUint16(a.off + 26, true) + dv.getUint16(a.off + 28, true);
    const dados = u8.subarray(ini, ini + a.tam);
    if (a.metodo === 0) return td.decode(dados);
    return new Response(new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const comp = [];
  const ss = await ler('xl/sharedStrings.xml');
  if (ss) xml(ss).querySelectorAll('si').forEach(si => comp.push([...si.querySelectorAll(':scope > t, :scope > r > t')].map(t => t.textContent).join('')));
  const wb = xml(await ler('xl/workbook.xml')), rels = xml(await ler('xl/_rels/workbook.xml.rels'));
  const alvo = {}; rels.querySelectorAll('Relationship').forEach(r => alvo[r.getAttribute('Id')] = r.getAttribute('Target'));
  const col = ref => { let n = 0; for (const ch of ref.replace(/\d+/g, '')) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
  const planilhas = [];
  for (const sh of wb.querySelectorAll('sheet')) {
    let t = alvo[sh.getAttribute('r:id')]; if (!t) continue;
    t = t.startsWith('/') ? t.slice(1) : 'xl/' + t.replace(/^\.\//, '');
    const doc = await ler(t); if (!doc) continue;
    const linhas = [];
    xml(doc).querySelectorAll('sheetData row').forEach(row => {
      const l = [];
      row.querySelectorAll('c').forEach(c => {
        const tp = c.getAttribute('t'), v = c.querySelector('v')?.textContent ?? '';
        l[col(c.getAttribute('r'))] = tp === 's' ? (comp[+v] ?? '') : tp === 'inlineStr' ? (c.querySelector('is')?.textContent ?? '') : v;
      });
      linhas.push(Array.from(l, x => x ?? ''));
    });
    planilhas.push({ nome: sh.getAttribute('name'), linhas });
  }
  return planilhas;
}

// Identifica colunas pelo cabeçalho: cliente, loja, cidade, situação (+ opcionais)
function mapearColunas(cab) {
  const n = cab.map(h => semAcento(h).trim());
  const achar = (...termos) => n.findIndex(h => termos.some(t => h === t || h.startsWith(t)));
  return {
    cliente: achar('cliente', 'rede', 'nome'), loja: achar('loja', 'unidade'), cidade: achar('cidade', 'municipio'),
    situacao: achar('situacao', 'contrato', 'situacao contratual'), endereco: achar('endereco'), contato: achar('contato', 'falar com'),
    telefone: achar('telefone', 'fone', 'celular'), franquia: achar('franquia'), obs: achar('observ')
  };
}

async function importarClientes(arquivo) {
  let linhas;
  try {
    if (/\.xlsx$/i.test(arquivo.name)) {
      const pls = await lerXlsx(await arquivo.arrayBuffer());
      const pl = pls.find(p => p.linhas.slice(0, 10).some(l => mapearColunas(l).cliente >= 0)) || pls[0];
      linhas = pl ? pl.linhas : [];
    } else linhas = parseCSV(await lerTextoArquivo(arquivo));
  } catch (e) { avisar('Não foi possível ler o arquivo: ' + esc(e.message) + '<br>Use CSV (separado por ; ou ,) ou Excel .xlsx.', 'Importação de clientes'); return; }
  const iCab = linhas.slice(0, 10).findIndex(l => mapearColunas(l).cliente >= 0);
  if (iCab < 0) { avisar('Não encontrei a coluna <b>cliente</b> no cabeçalho. Colunas esperadas: cliente, loja, cidade, situação.', 'Importação de clientes'); return; }
  const m = mapearColunas(linhas[iCab]);
  const pega = (l, k) => m[k] >= 0 ? String(l[m[k]] ?? '').trim() : '';
  const existentes = new Set(db.clientes.map(c => semAcento(c.cliente + '|' + c.loja)));
  const novos = [], vistos = new Set();
  let dup = 0, semSit = 0;
  linhas.slice(iCab + 1).forEach(l => {
    const nome = pega(l, 'cliente'); if (!nome) return;
    const loja = pega(l, 'loja'), k = semAcento(nome + '|' + loja);
    if (existentes.has(k) || vistos.has(k)) { dup++; return; }
    vistos.add(k);
    const s = semAcento(pega(l, 'situacao'));
    const situacao = !s ? null : /sem|nao|não/.test(s) ? 'sem' : /com|contrato|sim/.test(s) ? 'contrato' : null;
    if (!situacao) semSit++;
    const fr = lerDuracao(pega(l, 'franquia'));
    novos.push({ id: uid(), codigoAuvo: '', cliente: nome, loja, cidade: pega(l, 'cidade'), endereco: pega(l, 'endereco'), contato: pega(l, 'contato'), telefone: pega(l, 'telefone'), obs: pega(l, 'obs'), situacao, franquiaHoras: fr > 0 ? +(fr / 60).toFixed(2) : null });
  });
  if (!novos.length) { avisar(`Nenhum cliente novo no arquivo. ${dup} linha(s) já estavam cadastradas ou repetidas.`, 'Importação de clientes'); return; }
  abrirModal({
    titulo: 'Importar clientes', largura: 520, corpo: `<p><b>${novos.length}</b> cliente(s) novo(s) encontrado(s) em <b>${esc(arquivo.name)}</b>.${dup ? ` ${dup} repetido(s) serão ignorados.` : ''}</p>
      ${semSit ? `<div class="campo"><label for="impSit">Situação para as ${semSit} linha(s) sem situação contratual</label><select id="impSit">${SITUACOES.map(s => `<option value="${s.id}" ${s.id === 'sem' ? 'selected' : ''}>${s.nome}</option>`).join('')}</select></div>` : ''}`,
    botoes: [{ texto: 'Cancelar', acao: (w, f) => f() }, {
      texto: `Importar ${novos.length}`, classe: 'btn-prim', acao: (w, f) => {
        const pad = $('#impSit', w)?.value || 'sem';
        novos.forEach(c => { c.situacao = c.situacao || pad; if (c.situacao !== 'contrato') c.franquiaHoras = null; db.clientes.push(c); });
        salvar(); f(); render(); toast(`${novos.length} cliente(s) importado(s)`, 'ok');
      }
    }]
  });
}

// Recorte publicado: só o que o técnico precisa (sem franquia, sem clientes fora da agenda)
function montarPublicacao() {
  const de = addDias(segundaDe(hoje()), -7);
  const tarefas = db.tarefas.filter(t => t.data >= de).sort(ordenar);
  const ausencias = db.ausencias.filter(a => a.fim >= de);
  const ultima = [...tarefas.map(t => t.data), ...ausencias.map(a => a.fim)].sort().pop() || de;
  const ate = [ultima, addDias(segundaDe(hoje()), 13)].sort().pop();
  const usados = new Set(tarefas.flatMap(t => t.tecnicoIds));
  return {
    app: 'agenda-redefrigor-tecnicos', versao: 1,
    periodo: { de, ate },
    config: { mostrarDomingo: !!db.config.mostrarDomingo },
    tecnicos: db.tecnicos.filter(t => t.ativo !== false || usados.has(t.id)).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map(t => ({ id: t.id, nome: t.nome, cor: t.cor })),
    tipos: db.config.tipos.map(t => ({ id: t.id, nome: t.nome, cor: t.cor })),
    // Carro do plantão por dia (o site dos clientes não recebe: vai só para os técnicos)
    plantaoVeiculos: Object.fromEntries(db.plantaoVeiculos.filter(v => v.data >= de).sort((a, b) => a.data.localeCompare(b.data)).map(v => [v.data, v.veiculo])),
    ausencias: ausencias.map(a => ({ tipo: a.tipo, inicio: a.inicio, fim: a.fim, todos: !!a.todos, tecnicoIds: a.tecnicoIds, obs: a.obs || '' })),
    tarefas: tarefas.map(t => {
      const c = cliente(t.clienteId) || {};
      return {
        data: t.data, inicio: t.inicio, fim: min2hm(fimMin(t)), trabalho: trabalhoMin(t), desloc: deslocMin(t), periodo: periodoDe(t),
        status: t.status, prioridade: t.prioridade, tipo: t.tipo, descricao: t.descricao || '', veiculo: t.veiculo || '', auvo: t.auvo || '',
        tecnicoIds: t.tecnicoIds, rdv: Object.fromEntries(Object.entries(t.rdv || {}).filter(([id, v]) => t.tecnicoIds.includes(id) && v)),
        cliente: { nome: c.cliente || '', loja: c.loja || '', cidade: c.cidade || '', endereco: c.endereco || '', contato: c.contato || '', telefone: c.telefone || '' }
      };
    })
  };
}
function hashTexto(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function publicacaoPendente() {
  const p = db.meta.publicacao;
  return !p || p.cifrado || p.hash !== hashTexto(JSON.stringify(montarPublicacao()));
}

// --- API do GitHub ---
function b64Utf8(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function deB64Utf8(b64) { const bin = atob(b64.replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
async function gh(acc, caminho, opcoes = {}) {
  const r = await fetch('https://api.github.com' + caminho, {
    ...opcoes, cache: 'no-store',
    headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + acc.token, 'X-GitHub-Api-Version': '2022-11-28', ...(opcoes.headers || {}) }
  });
  const corpo = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(corpo.message || 'HTTP ' + r.status); e.status = r.status; throw e; }
  return corpo;
}
const caminhoGh = (acc, arq) => `/repos/${acc.repo}/contents/${[acc.pasta.replace(/^\/|\/$/g, ''), arq].filter(Boolean).map(encodeURIComponent).join('/')}`;
async function lerArquivoGh(acc, arq) {
  try { const r = await gh(acc, `${caminhoGh(acc, arq)}?ref=${encodeURIComponent(acc.branch)}`); return { sha: r.sha, texto: deB64Utf8(r.content) }; }
  catch (e) { if (e.status === 404) return null; throw e; }
}
async function gravarArquivoGh(acc, arq, texto, mensagem) {
  for (let tentativa = 0; tentativa < 2; tentativa++) {
    const atual = await lerArquivoGh(acc, arq);
    if (atual && atual.texto === texto) return false; // já está igual
    try {
      await gh(acc, caminhoGh(acc, arq), { method: 'PUT', body: JSON.stringify({ message: mensagem, content: b64Utf8(texto), branch: acc.branch, ...(atual ? { sha: atual.sha } : {}) }) });
      return true;
    } catch (e) { if (!(e.status === 409 || e.status === 422) || tentativa) throw e; } // versão mudou no meio: tenta de novo
  }
}
function mensagemErroGh(e) {
  if (e.status === 401) return 'Token inválido ou expirado. Gere outro no GitHub e informe em “Acesso ao GitHub”.';
  if (e.status === 403) return 'O token não tem permissão para gravar neste repositório (precisa de Contents: Read and write e, se a organização exigir, aprovação do administrador).';
  if (e.status === 404) return 'Repositório não encontrado, ou o token não tem acesso a ele. Confira o nome do repositório.';
  if (e instanceof TypeError) return 'Sem conexão com o GitHub. Verifique a internet.';
  return e.message;
}

const VERSAO = document.querySelector('meta[name="versao-agenda"]')?.content || '';
// Grava uma página só se a nossa versão for mais nova que a publicada
async function gravarPagina(acc, arq, conteudo, mensagem) {
  const atual = await lerArquivoGh(acc, arq);
  const versaoPublicada = atual && (atual.texto.match(/name="versao-agenda" content="([^"]+)"/) || [])[1];
  if (atual && versaoPublicada && versaoPublicada >= VERSAO) return false;
  return gravarArquivoGh(acc, arq, conteudo, mensagem);
}
// Atualiza as páginas (técnicos e agenda online) e, se mudou algo, as tarefas
// Remove os endereços antigos de administração (só depois que o painel novo está no GitHub)
async function limparPaineisAntigos(acc) {
  const raiz = { ...acc, pasta: '' }, antiga = { ...acc, pasta: PASTA_TECNICOS_ANTIGA };
  if (!await lerArquivoGh({ ...acc, pasta: PASTA_PAINEL }, 'index.html')) return false;
  let mudou = false;
  const apagar = async (a, arq, testar, motivo) => {
    const atual = await lerArquivoGh(a, arq);
    if (!atual || (testar && !testar(atual.texto))) return;
    await gh(a, caminhoGh(a, arq), { method: 'DELETE', body: JSON.stringify({ message: motivo, sha: atual.sha, branch: a.branch }) });
    mudou = true;
  };
  await apagar(antiga, 'admin.html', null, 'Remove painel antigo (agora no painel único)');
  await apagar(raiz, 'admin.html', txt => /Painel de Plant|plantao-admin/.test(txt), 'Remove painel antigo (agora no painel único)');
  // Endereço antigo dos técnicos: só apaga depois que a página e os dados estão na pasta nova
  if (acc.pasta !== PASTA_TECNICOS_ANTIGA && await lerArquivoGh(acc, 'index.html') && await lerArquivoGh(acc, 'dados.json')) {
    await apagar(antiga, 'index.html', null, 'Agenda dos técnicos mudou de endereço');
    await apagar(antiga, 'dados.json', null, 'Agenda dos técnicos mudou de endereço');
  }
  // README público sem endereços internos
  const readme = await lerArquivoGh(raiz, 'README.md');
  if (readme && /admin\.html|`agenda\/`/.test(readme.texto)) {
    await gravarArquivoGh(raiz, 'README.md', '# Plantão Técnico REDEFRIGOR\n\nSite com o técnico de plantão do dia e o passo a passo para abrir chamados no Auvodesk.\n\n| Arquivo | Para quê |\n|---|---|\n| `index.html` | Página pública (clientes) |\n| `escala.json` | Escala de plantões |\n| logos | Imagens do site |\n\nA agenda dos técnicos e o painel administrativo da Redefrigor são de acesso restrito.\n', 'README sem endereços internos');
    mudou = true;
  }
  return mudou;
}
async function enviarPublicacao(acc, forcarDados) {
  const paginas = [await gravarPagina(acc, 'index.html', PAGINA_TECNICO, 'Agenda dos técnicos: página')];
  if (PAGINA_ADMIN && nuvem.ativa) paginas.push(await gravarPagina({ ...acc, pasta: PASTA_PAINEL }, 'index.html', PAGINA_ADMIN, 'Painel do administrador'));
  const pub = montarPublicacao(), hash = hashTexto(JSON.stringify(pub));
  if (forcarDados || db.meta.publicacao?.hash !== hash || db.meta.publicacao?.cifrado || db.meta.publicacao?.pasta !== acc.pasta) {
    await gravarArquivoGh(acc, 'dados.json', JSON.stringify({ ...pub, publicadoEm: new Date().toISOString() }, null, 1), 'Agenda dos técnicos: atualiza tarefas');
    db.meta.publicacao = { hash, em: new Date().toISOString(), pasta: acc.pasta };
    salvar();
  }
  if (PAGINA_ADMIN && nuvem.ativa) paginas.push(await limparPaineisAntigos(acc).catch(e => { console.warn('Não foi possível remover endereços antigos', e); return false; }));
  return paginas.some(Boolean);
}

        <p style="margin-top:10px;font-size:12.5px;color:var(--cinza)">Na primeira publicação, o GitHub pode levar cerca de 1 minuto para colocar a página no ar. Cada técnico escolhe o próprio nome no primeiro acesso.</p>`,
      botoes: [{ texto: 'Copiar link', acao: (w) => { navigator.clipboard?.writeText(linkTecnicos(acc)).then(() => toast('Link copiado', 'ok'), () => toast('Não foi possível copiar; selecione o link e copie', 'erro')); } }, { texto: 'Fechar', classe: 'btn-prim', acao: (w, f) => f() }]
    });
  } catch (e) {
    console.error(e);
    avisar(`<b>Não foi possível publicar.</b><br>${esc(mensagemErroGh(e))}<br><br>Nada foi alterado na sua agenda.`, 'Publicar para técnicos');
  } finally {
    if (botao) { botao.disabled = false; botao.innerHTML = botao.dataset.texto; }
  }
}

/* ======================= 8c. AGENDA NA NUVEM (vários computadores) ======================= */
// A agenda completa fica no mesmo repositório do GitHub, num ramo separado ("agenda-dados",
// que não mexe no site), CRIPTOGRAFADA com AES-GCM. A chave vem da senha da agenda
// (PBKDF2-SHA256), então o arquivo é ilegível para quem não tem a senha.
// Várias pessoas podem editar: cada registro guarda a hora da última alteração e,
// quando duas pessoas salvam ao mesmo tempo, as alterações são mescladas.
// Publicado na internet (GitHub Pages, Vercel…), e não aberto como arquivo ou em teste local
const HOSPEDADO = /^https?:$/.test(location.protocol) && !['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
const CHAVE_NUVEM = 'agendaRedefrigor.nuvem';
const NUVEM = { branch: 'agenda-dados', arquivo: 'agenda.enc.json', iter: 250000 };
const COLECOES = ['clientes', 'tecnicos', 'tarefas', 'ausencias', 'plantaoVeiculos'];
const nuvem = { ativa: false, estado: 'desligada', msg: '', sha: null, senha: null, chave: null, salt: null, pendente: false, enviando: false, timer: null, ultima: null, mudancas: 0 };

// --- Registro de alterações (carimbo de data em cada item e lista de excluídos) ---
let instantaneo = null;
const textoRegistro = r => { const { atualizadoEm, ...resto } = r; return JSON.stringify(resto); };
function tirarInstantaneo() {
  instantaneo = new Map();
  COLECOES.forEach(c => db[c].forEach(r => instantaneo.set(c + ':' + r.id, textoRegistro(r))));
  instantaneo.set('config', JSON.stringify(db.config));
}
function carimbar() {
  if (!instantaneo) { tirarInstantaneo(); return; }
  const agora = new Date().toISOString(), vistos = new Set();
  db.meta.excluidos ||= {};
  COLECOES.forEach(c => db[c].forEach(r => {
    const k = c + ':' + r.id; vistos.add(k);
    if (instantaneo.get(k) !== textoRegistro(r)) { r.atualizadoEm = agora; delete db.meta.excluidos[r.id]; }
  }));
  instantaneo.forEach((_, k) => { if (k !== 'config' && !vistos.has(k)) db.meta.excluidos[k.slice(k.indexOf(':') + 1)] = agora; });
  if (instantaneo.get('config') !== JSON.stringify(db.config)) db.meta.configEm = agora;
  tirarInstantaneo();
}

// Junta a versão local (a) com a da nuvem (b): vale a alteração mais recente de cada item
function mesclarDb(a, b) {
  const exc = { ...(b.meta.excluidos || {}) };
  Object.entries(a.meta.excluidos || {}).forEach(([id, t]) => { if (!exc[id] || t > exc[id]) exc[id] = t; });
  const limite = new Date(Date.now() - 120 * 864e5).toISOString();
  Object.keys(exc).forEach(id => { if (exc[id] < limite) delete exc[id]; });
  const r = normalizarDb(JSON.parse(JSON.stringify(b)));
  COLECOES.forEach(c => {
    const mapa = new Map();
    [...b[c], ...a[c]].forEach(x => { const y = mapa.get(x.id); if (!y || (x.atualizadoEm || '') > (y.atualizadoEm || '')) mapa.set(x.id, x); });
    r[c] = [...mapa.values()].filter(x => !exc[x.id] || (x.atualizadoEm || '') > exc[x.id]).map(x => JSON.parse(JSON.stringify(x)));
  });
  const maisNovo = (x, y) => [x, y].filter(Boolean).sort().pop() || null;
  r.config = (a.meta.configEm || '') > (b.meta.configEm || '') ? JSON.parse(JSON.stringify(a.config)) : r.config;
  r.meta = {
    ...r.meta, excluidos: exc,
    configEm: maisNovo(a.meta.configEm, b.meta.configEm) || '',
    ultimoBackup: maisNovo(a.meta.ultimoBackup, b.meta.ultimoBackup),
    publicacao: [a.meta.publicacao, b.meta.publicacao].filter(Boolean).sort((x, y) => x.em.localeCompare(y.em)).pop() || null,
    clientesAuvoCarregados: true, tecnicosAuvoCarregados: true,
    tecnicosAuvoVistos: [...new Set([...(a.meta.tecnicosAuvoVistos || []), ...(b.meta.tecnicosAuvoVistos || [])])]
  };
  return r;
}
const textoColecoes = d => JSON.stringify([COLECOES.map(c => d[c]), d.config]);

// --- Criptografia (Web Crypto, nativa do navegador) ---
const b64Bytes = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const bytesB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const comprimir = async txt => new Uint8Array(await new Response(new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
const descomprimir = async u8 => new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
async function derivarChave(senha, salt, iter = NUVEM.iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function cifrarDb(d) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, nuvem.chave, await comprimir(JSON.stringify(d))));
  return JSON.stringify({ app: 'agenda-redefrigor-nuvem', versao: 1, kdf: { alg: 'PBKDF2-SHA256', iter: NUVEM.iter, salt: b64Bytes(nuvem.salt) }, iv: b64Bytes(iv), dados: b64Bytes(ct), atualizadoEm: new Date().toISOString() });
}
async function decifrarEnvelope(env, senha) {
  if (!env || env.app !== 'agenda-redefrigor-nuvem') throw new Error('O arquivo da nuvem não é uma agenda válida.');
  const salt = bytesB64(env.kdf.salt);
  const mesmaChave = nuvem.chave && nuvem.salt && b64Bytes(nuvem.salt) === env.kdf.salt && nuvem.senha === senha;
  const chave = mesmaChave ? nuvem.chave : await derivarChave(senha, salt, env.kdf.iter);
  let txt;
  try { txt = await descomprimir(new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytesB64(env.iv) }, chave, bytesB64(env.dados)))); }
  catch (e) { throw Object.assign(new Error('Senha da agenda incorreta.'), { senhaErrada: true }); }
  return { dados: normalizarDb(JSON.parse(txt)), chave, salt };
}

// --- Arquivo no GitHub (ramo separado do site) ---
const caminhoNuvem = acc => `/repos/${acc.repo}/contents/${NUVEM.arquivo}`;
async function lerNuvem(acc) {
  try { const r = await gh(acc, `${caminhoNuvem(acc)}?ref=${NUVEM.branch}`); return { sha: r.sha, envelope: JSON.parse(deB64Utf8(r.content)) }; }
  catch (e) { if (e.status === 404) return null; throw e; }
}
async function garantirRamo(acc) {
  try { await gh(acc, `/repos/${acc.repo}/git/ref/heads/${NUVEM.branch}`); return; }
  catch (e) { if (e.status !== 404) throw e; }
  const base = await gh(acc, `/repos/${acc.repo}/git/ref/heads/${encodeURIComponent(acc.branch)}`);
  await gh(acc, `/repos/${acc.repo}/git/refs`, { method: 'POST', body: JSON.stringify({ ref: `refs/heads/${NUVEM.branch}`, sha: base.object.sha }) });
}

// --- Estado salvo neste computador ---
function lerConfigNuvem() { try { return JSON.parse(localStorage.getItem(CHAVE_NUVEM) || 'null'); } catch (e) { return null; } }
function gravarConfigNuvem(lembrarSenha) {
  try {
    localStorage.setItem(CHAVE_NUVEM, JSON.stringify({ ativa: true, ...(lembrarSenha ? { senha: nuvem.senha } : {}) }));
    sessionStorage.setItem(CHAVE_NUVEM + '.senha', nuvem.senha);
  } catch (e) { }
}
function senhaGuardada() { const c = lerConfigNuvem(); try { return c?.senha || sessionStorage.getItem(CHAVE_NUVEM + '.senha'); } catch (e) { return c?.senha || null; } }
function desconectarNuvem() {
  clearTimeout(nuvem.timer);
  Object.assign(nuvem, { ativa: false, estado: 'desligada', msg: '', sha: null, senha: null, chave: null, salt: null, pendente: false });
  try { localStorage.removeItem(CHAVE_NUVEM); sessionStorage.removeItem(CHAVE_NUVEM + '.senha'); } catch (e) { }
}
function salvarLocal() {
  try { localStorage.setItem(CHAVE_DADOS, JSON.stringify(db)); } catch (e) { toast('Não foi possível salvar neste navegador: ' + e.message, 'erro'); }
}
function estadoNuvem(estado, msg = '') { nuvem.estado = estado; nuvem.msg = msg; renderFaixaDados(); }

// --- Sincronização ---
function nuvemAgendar() {
  if (!nuvem.ativa) return;
  nuvem.pendente = true; nuvem.mudancas++;
  if (nuvem.estado === 'ok') estadoNuvem('pendente');
  clearTimeout(nuvem.timer);
  nuvem.timer = setTimeout(enviarNuvem, 4000);
}
// Aplica a versão da nuvem: mescla com o que existe aqui e avisa se veio algo novo
async function aplicarRemoto(remoto, avisar, dentroDoEnvio = false) {
  const { dados, chave, salt } = await decifrarEnvelope(remoto.envelope, nuvem.senha);
  nuvem.chave = chave; nuvem.salt = salt; nuvem.sha = remoto.sha;
  carimbar();
  const antes = textoColecoes(db);
  db = mesclarDb(db, dados);
  tirarInstantaneo(); salvarLocal();
  if (!dentroDoEnvio && textoColecoes(db) !== textoColecoes(dados)) { nuvem.pendente = true; nuvem.mudancas++; } // há alterações daqui que a nuvem não tem
  if (antes !== textoColecoes(db)) {
    if (!$('.modal-fundo')) render();
    if (avisar) toast('Agenda atualizada com alterações de outra pessoa');
  }
}
async function enviarNuvem() {
  if (!nuvem.ativa || nuvem.enviando || !nuvem.pendente) return;
  const acc = lerAcessoGh();
  if (!acc?.token) { estadoNuvem('erro', 'Token do GitHub não configurado neste computador.'); return; }
  nuvem.enviando = true; nuvem.pendente = false; clearTimeout(nuvem.timer);
  const marca = nuvem.mudancas;
  estadoNuvem('salvando');
  try {
    for (let tentativa = 0; ; tentativa++) {
      try {
        const r = await gh(acc, caminhoNuvem(acc), { method: 'PUT', body: JSON.stringify({ message: 'Agenda: salva alterações', content: b64Utf8(await cifrarDb(db)), branch: NUVEM.branch, ...(nuvem.sha ? { sha: nuvem.sha } : {}) }) });
        nuvem.sha = r.content.sha; nuvem.ultima = new Date();
        nuvem.pendente = nuvem.mudancas !== marca; // só fica pendente se alguém mexeu durante o envio
        estadoNuvem(nuvem.pendente ? 'pendente' : 'ok');
        break;
      } catch (e) {
        // Outra pessoa salvou antes: junta as alterações e tenta de novo
        if (!(e.status === 409 || e.status === 422) || tentativa >= 2) throw e;
        const remoto = await lerNuvem(acc);
        if (remoto) await aplicarRemoto(remoto, true, true); else nuvem.sha = null;
      }
    }
  } catch (e) {
    console.error(e);
    nuvem.pendente = true;
    estadoNuvem(e instanceof TypeError ? 'offline' : 'erro', e.senhaErrada ? e.message : mensagemErroGh(e));
    nuvem.timer = setTimeout(enviarNuvem, 30000);
  } finally {
    nuvem.enviando = false;
    if (nuvem.pendente && ['ok', 'pendente'].includes(nuvem.estado)) { clearTimeout(nuvem.timer); nuvem.timer = setTimeout(enviarNuvem, 4000); }
  }
}
// Busca alterações de outras pessoas (sem atrapalhar quem está com um formulário aberto)
async function buscarNuvem(avisar = true) {
  if (!nuvem.ativa || nuvem.enviando || nuvem.pendente) return;
  const acc = lerAcessoGh(); if (!acc?.token) return;
  try {
    const remoto = await lerNuvem(acc);
    if (!remoto) { nuvem.sha = null; nuvem.pendente = true; enviarNuvem(); return; }
    if (remoto.sha !== nuvem.sha) await aplicarRemoto(remoto, avisar);
    if (nuvem.pendente) enviarNuvem(); else estadoNuvem('ok');
  } catch (e) {
    console.error(e);
    estadoNuvem(e instanceof TypeError ? 'offline' : 'erro', e.senhaErrada ? 'A senha da agenda foi trocada em outro computador. Conecte de novo.' : mensagemErroGh(e));
  }
}
setInterval(() => { if (!document.hidden && !$('.modal-fundo') && $('#apresentacao').hidden) buscarNuvem(); }, 45000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && nuvem.pendente) enviarNuvem();
  else if (!document.hidden) buscarNuvem();
});
window.addEventListener('beforeunload', e => { if (nuvem.ativa && (nuvem.pendente || nuvem.enviando)) { enviarNuvem(); e.preventDefault(); e.returnValue = ''; } });

// Ao abrir: usa a cópia local na hora e depois sincroniza com a nuvem
async function iniciarNuvem() {
  const cfg = lerConfigNuvem();
  if (!cfg?.ativa) { if (HOSPEDADO) render(); return; }
  const senha = senhaGuardada(), acc = lerAcessoGh();
  if (!senha || !acc?.token) { abrirConectarNuvem(); return; }
  nuvem.ativa = true; nuvem.senha = senha;
  estadoNuvem('salvando', 'Sincronizando…');
  try {
    const remoto = await lerNuvem(acc);
    if (!remoto) { nuvem.pendente = true; await enviarNuvem(); return; }
    await aplicarRemoto(remoto, false);
    render();
    if (nuvem.pendente) enviarNuvem(); else estadoNuvem('ok');
  } catch (e) {
    console.error(e);
    if (e.senhaErrada) { desconectarNuvem(); abrirConectarNuvem(); avisar('A senha guardada não abre a agenda (ela pode ter sido trocada). Informe a senha atual.', 'Agenda na nuvem'); return; }
    estadoNuvem(e instanceof TypeError ? 'offline' : 'erro', mensagemErroGh(e));
  }
}

// Tela para conectar este computador (cria a agenda na nuvem na primeira vez)
function abrirConectarNuvem() {
  const acc = lerAcessoGh() || { ...GH_PADRAO };
  const corpo = `<form id="formNuvem" class="form-grade" autocomplete="off">
    <div class="campo c12"><div class="info-box">Com a agenda na nuvem, você e outras pessoas editam a mesma agenda de qualquer computador pelo link <b>${esc(linkPainel(acc))}</b>. Os dados ficam no GitHub <b>criptografados com a senha da agenda</b>: sem a senha, ninguém consegue ler.</div></div>
    <div class="campo c12"><label for="nvToken">Token do GitHub</label><input type="password" id="nvToken" value="${esc(acc.token || '')}" placeholder="github_pat_…"><small>O mesmo token usado para publicar (Contents: Read and write neste repositório). Cada pessoa pode ter o seu.</small></div>
    <div class="campo c6"><label for="nvSenha">Senha da agenda</label><input type="password" id="nvSenha" autocomplete="new-password" placeholder="mínimo 8 caracteres"></div>
    <div class="campo c6"><label for="nvSenha2">Confirmar senha <span style="font-weight:normal;color:var(--cinza)">(só na criação)</span></label><input type="password" id="nvSenha2" autocomplete="new-password"></div>
    <div class="campo c12"><label class="check"><input type="checkbox" id="nvLembrar" checked> Lembrar token e senha neste computador</label><small>Desmarque em computadores compartilhados.</small></div>
    <div class="c12" id="nvInfo"></div>
  </form>`;
  const conectar = async (w, fechar) => {
    const info = $('#nvInfo', w), msg = (t, tipo = '') => info.innerHTML = `<div class="info-box ${tipo}">${t}</div>`;
    const a = { ...acc, token: $('#nvToken', w).value.trim() }, senha = $('#nvSenha', w).value, senha2 = $('#nvSenha2', w).value, lembrar = $('#nvLembrar', w).checked;
    if (!a.token) return msg('Informe o token do GitHub.', 'erro');
    if (senha.length < 8) return msg('A senha da agenda precisa ter pelo menos 8 caracteres.', 'erro');
    msg('Verificando acesso…');
    try {
      const repo = await gh(a, `/repos/${a.repo}`);
      if (!repo.permissions?.push) throw Object.assign(new Error(''), { status: 403 });
      const remoto = await lerNuvem(a);
      if (!remoto) {
        // Primeira vez: cria a agenda na nuvem com os dados deste computador
        if (senha !== senha2) return msg('Esta é a criação da agenda na nuvem: confirme a senha no segundo campo (precisa ser igual).', 'erro');
        if (!await confirmar(`Criar a agenda na nuvem com os dados deste computador?<br><br><b>${db.clientes.length}</b> clientes · <b>${db.tecnicos.length}</b> técnicos · <b>${db.tarefas.length}</b> tarefas · <b>${db.ausencias.length}</b> folgas/férias.<br><br><b>Guarde a senha em local seguro:</b> sem ela não é possível abrir a agenda da nuvem (o backup em arquivo continua funcionando).`, { titulo: 'Criar agenda na nuvem', ok: 'Criar' })) return msg('');
        msg('Criando a agenda na nuvem…');
        await garantirRamo(a);
        nuvem.salt = crypto.getRandomValues(new Uint8Array(16));
        nuvem.chave = await derivarChave(senha, nuvem.salt);
        Object.assign(nuvem, { senha, sha: null, ativa: true, pendente: true });
        salvarAcessoGh(a, lembrar); gravarConfigNuvem(lembrar);
        carimbar(); salvarLocal();
        await enviarNuvem();
        if (nuvem.estado !== 'ok') throw new Error(nuvem.msg || 'Falha ao enviar para a nuvem.');
        if (PAGINA_ADMIN) await gravarPagina({ ...a, pasta: PASTA_PAINEL }, 'index.html', PAGINA_ADMIN, 'Painel do administrador').catch(e => console.warn(e));
        fechar(); render();
        abrirModal({ titulo: 'Agenda na nuvem criada', largura: 520, fecharFora: true, corpo: `<p>Pronto! Para usar em outro computador, abra o link abaixo e conecte com o <b>token</b> e a <b>senha da agenda</b>:</p><div class="info-box ok" style="word-break:break-all"><b>${esc(linkPainel(a))}</b></div><p style="margin-top:10px;font-size:12.5px;color:var(--cinza)">Na primeira vez, o GitHub pode levar cerca de 1 minuto para colocar o link no ar.</p>`, botoes: [{ texto: 'Copiar link', acao: () => navigator.clipboard?.writeText(linkPainel(a)).then(() => toast('Link copiado', 'ok')) }, { texto: 'Fechar', classe: 'btn-prim', acao: (w2, f2) => f2() }] });
        return;
      }
      // Já existe: abre com a senha e substitui os dados deste computador
      msg('Abrindo a agenda da nuvem…');
      nuvem.senha = senha;
      const { dados, chave, salt } = await decifrarEnvelope(remoto.envelope, senha);
      const temAqui = db.tarefas.length || db.ausencias.length || db.tecnicos.some(t => !TECNICOS_AUVO.some(x => x.codigoAuvo === t.codigoAuvo));
      if (temAqui && !await confirmar(`Este computador já tem uma agenda (${db.tarefas.length} tarefas). Ela será <b>substituída</b> pela agenda da nuvem (${dados.tarefas.length} tarefas, ${dados.clientes.length} clientes).<br><br>Uma cópia da agenda atual fica guardada neste navegador por segurança.`, { titulo: 'Usar a agenda da nuvem', ok: 'Usar a agenda da nuvem', perigo: true })) { nuvem.senha = null; return msg(''); }
      try { localStorage.setItem(CHAVE_DADOS + '.antesNuvem', JSON.stringify(db)); } catch (e) { }
      Object.assign(nuvem, { chave, salt, sha: remoto.sha, ativa: true, pendente: false });
      db = dados; tirarInstantaneo(); salvarLocal();
      salvarAcessoGh(a, lembrar); gravarConfigNuvem(lembrar);
      fechar(); estadoNuvem('ok'); render();
      toast('Conectado à agenda na nuvem', 'ok');
    } catch (e) {
      console.error(e);
      if (!e.senhaErrada) nuvem.senha = null;
      msg(esc(e.senhaErrada ? 'Senha da agenda incorreta.' : mensagemErroGh(e)), 'erro');
      if (e.senhaErrada) nuvem.senha = null;
    }
  };
  abrirModal({ titulo: 'Agenda na nuvem (vários computadores)', corpo, largura: 620, botoes: [{ texto: 'Cancelar', acao: (w, f) => f() }, { texto: 'Conectar', classe: 'btn-prim', acao: conectar }] });
}

/* ======================= 8d. ESCALA DE PLANTÕES (site dos clientes) ======================= */
// Substitui o antigo painel de plantões. A escala continua no escala.json da raiz do
// repositório (lido pelo site dos clientes e pela aba Plantões do celular dos técnicos),
// mas os TÉCNICOS e TELEFONES vêm do cadastro da agenda: cadastra uma vez só.
// Cada alteração é publicada sozinha em alguns segundos.
const pl = { estado: 'nao-carregado', config: {}, plantoes: [], extras: {}, sha: null, msg: '', mes: null, timer: null, salvando: false, pendente: false, salvoEm: null, publicado: '' };
const accRaiz = () => { const a = lerAcessoGh(); return a && a.token ? { ...a, pasta: '' } : null; };
const normNome = s => semAcento(s).replace(/\s+/g, ' ').trim();
function foneEscala(tel) { let d = String(tel || '').replace(/\D/g, ''); if (!d) return ''; if (d.length <= 11) d = '55' + d; return `+${d.slice(0, 2)} ${d.slice(2, 4)} ${d.slice(4, d.length - 4)}-${d.slice(-4)}`; }
function foneBr(tel) { const d = String(tel || '').replace(/\D/g, ''); return d.length >= 12 ? `(${d.slice(2, 4)}) ${d.slice(4, d.length - 4)}-${d.slice(-4)}` : d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : tel || ''; }
// Técnico da escala: o da agenda (pelo id) ou um "extra" que só existe na escala antiga
const tecPlantao = id => tecnico(id) || pl.extras[id] || null;
const plantonistas = data => pl.estado === 'ok' ? pl.plantoes.filter(p => p.data === data).map(p => tecPlantao(p.tecId)).filter(Boolean) : [];
const plantaoDe = (tecId, data) => pl.estado === 'ok' && pl.plantoes.some(p => p.data === data && p.tecId === tecId);
// Carro do plantão (só agenda e técnicos; o site dos clientes não recebe)
const veiculoPlantao = data => db.plantaoVeiculos.find(v => v.data === data)?.veiculo || '';
function definirVeiculoPlantao(data, placa) {
  placa = String(placa || '').trim().toUpperCase().replace(/\s+/g, '');
  const id = 'pv-' + data, atual = db.plantaoVeiculos.find(v => v.id === id);
  if (!placa) db.plantaoVeiculos = db.plantaoVeiculos.filter(v => v.id !== id);
  else if (atual) atual.veiculo = placa;
  else db.plantaoVeiculos.push({ id, data, veiculo: placa });
  if (placa && !(db.config.veiculos || []).includes(placa)) (db.config.veiculos ||= []).push(placa);
  salvar();
}

// Monta o escala.json no formato que o site dos clientes já usa
function escalaParaPublicar() {
  const usados = [...new Set(pl.plantoes.map(p => p.tecId))].map(tecPlantao).filter(Boolean);
  const c = { ...pl.config };
  if (c.inicio && c.fim) c.horario = `${c.inicio} às ${c.fim}`;
  return {
    config: c,
    tecnicos: usados.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map(t => ({ id: t.id, nome: t.nome, telefone: foneEscala(t.telefone) })),
    plantoes: pl.plantoes.filter(p => tecPlantao(p.tecId)).sort((a, b) => a.data.localeCompare(b.data)).map(p => ({ data: p.data, tecnicoId: p.tecId }))
  };
}

async function carregarEscala() {
  const acc = accRaiz();
  if (!acc) { pl.estado = 'sem-token'; if (ui.aba === 'plantoes') render(); return; }
  pl.estado = 'carregando'; if (ui.aba === 'plantoes') render();
  try {
    const a = await lerArquivoGh(acc, 'escala.json');
    if (!a) throw new Error('O arquivo escala.json não foi encontrado no repositório.');
    const d = JSON.parse(a.texto);
    // Liga cada técnico da escala ao cadastro da agenda pelo id ou pelo nome
    const extras = {}, mapa = {};
    (d.tecnicos || []).forEach(t => {
      const daAgenda = tecnico(t.id) || db.tecnicos.find(x => normNome(x.nome) === normNome(t.nome));
      if (daAgenda) mapa[t.id] = daAgenda.id; else { extras[t.id] = { ...t, extra: true }; mapa[t.id] = t.id; }
    });
    Object.assign(pl, {
      config: d.config || {}, extras, sha: a.sha, estado: 'ok', msg: '', pendente: false,
      plantoes: (d.plantoes || []).filter(p => mapa[p.tecnicoId]).map(p => ({ data: p.data, tecId: mapa[p.tecnicoId] }))
    });
    // Se o que está no site difere do cadastro da agenda (nomes, telefones), republica uma vez
    pl.publicado = JSON.stringify(escalaParaPublicar());
    const noSite = JSON.stringify({ config: d.config || {}, tecnicos: d.tecnicos || [], plantoes: d.plantoes || [] });
    if (noSite !== pl.publicado) { pl.publicado = noSite; alterouEscala(true); }
  } catch (e) { console.error(e); pl.estado = 'erro'; pl.msg = mensagemErroGh(e); }
  render();
}
function alterouEscala(semRender) {
  pl.pendente = true;
  clearTimeout(pl.timer); pl.timer = setTimeout(salvarEscala, 2500);
  if (!semRender) render();
}
// Chamado a cada salvar() da agenda: nome/telefone de técnico mudou? republica a escala
function conferirTecnicosNaEscala() {
  if (pl.estado !== 'ok' || pl.salvando) return;
  if (JSON.stringify(escalaParaPublicar()) !== pl.publicado && !pl.pendente) alterouEscala(true);
}
async function salvarEscala() {
  if (pl.salvando || !pl.pendente) return;
  const acc = accRaiz(); if (!acc) return;
  const dados = escalaParaPublicar();
  if (JSON.stringify(dados) === pl.publicado) { pl.pendente = false; render(); return; } // nada mudou de verdade: não envia
  pl.salvando = true; pl.pendente = false; render();
  try {
    const r = await gh(acc, caminhoGh(acc, 'escala.json'), { method: 'PUT', body: JSON.stringify({ message: 'Atualiza escala de plantões', content: b64Utf8(JSON.stringify({ ...dados, atualizadoEm: new Date().toISOString() }, null, 2) + '\n'), sha: pl.sha, branch: acc.branch }) });
    pl.sha = r.content.sha; pl.salvoEm = new Date(); pl.msg = ''; pl.publicado = JSON.stringify(dados);
    toast('Escala de plantões publicada no site', 'ok');
  } catch (e) {
    console.error(e);
    pl.pendente = true;
    pl.msg = (e.status === 409 || e.status === 422) ? 'A escala foi alterada em outro lugar. Clique em “Recarregar” e refaça a última alteração.' : mensagemErroGh(e);
    toast('Não foi possível publicar a escala', 'erro');
  } finally { pl.salvando = false; render(); }
}
