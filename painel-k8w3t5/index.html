// Quantos plantões cada técnico pegou em cada mês do ano (a escala guarda todo o histórico)
function htmlHistoricoPlantoes() {
  const hj = hoje(), anoAtual = +hj.slice(0, 4), mesAtual = hj.slice(0, 7);
  const ano = pl.ano ||= anoAtual;
  const anos = pl.plantoes.map(p => +p.data.slice(0, 4));
  const primeiroAno = Math.min(anoAtual, ...anos), ultimoAno = Math.max(anoAtual, ...anos);
  const doAno = pl.plantoes.filter(p => p.data.startsWith(ano + '-'));
  const cont = {};
  doAno.forEach(p => { const m = +p.data.slice(5, 7) - 1; (cont[p.tecId] ||= Array(12).fill(0))[m]++; });
  const linhas = Object.entries(cont).map(([id, meses]) => ({ t: tecPlantao(id), meses, total: meses.reduce((a, b) => a + b, 0) }))
    .filter(l => l.t).sort((a, b) => b.total - a.total || a.t.nome.localeCompare(b.t.nome, 'pt-BR'));
  const porMes = MESES.map((_, m) => linhas.reduce((s, l) => s + l.meses[m], 0));
  const cabMes = (nome, m) => { const ym = `${ano}-${String(m + 1).padStart(2, '0')}`; return `<th class="${ym === mesAtual ? 'atual' : ''}"><button type="button" data-acao="pl-ir-mes" data-mes="${ym}-01" title="Ver ${nome.toLowerCase()} no calendário">${nome.slice(0, 3)}</button></th>`; };
  const cel = (n, m) => `<td class="${`${ano}-${String(m + 1).padStart(2, '0')}` === mesAtual ? 'atual' : ''}">${n || '<span class="zero">–</span>'}</td>`;
  return `<section class="card">
    <div class="sec-titulo"><h2>Histórico de plantões</h2>
      <div class="cal-cab-pl" style="margin:0"><button class="btn btn-sec btn-icone" data-acao="pl-ano" data-passo="-1" aria-label="Ano anterior" ${ano <= primeiroAno ? 'disabled' : ''}>${ICO.esq}</button>
      <b style="min-width:60px">${ano}</b>
      <button class="btn btn-sec btn-icone" data-acao="pl-ano" data-passo="1" aria-label="Próximo ano" ${ano >= ultimoAno ? 'disabled' : ''}>${ICO.dir}</button></div></div>
    <p style="margin:0 0 12px;font-size:13px;color:var(--cinza)">Quantidade de dias de plantão de cada técnico por mês. Inclui os plantões já marcados para os próximos dias. Clique no mês para abrir no calendário.</p>
    ${linhas.length ? `<div class="pl-hist-rolar"><table class="pl-hist">
      <thead><tr><th class="tec">Técnico</th>${MESES.map(cabMes).join('')}<th class="tot">Total ${ano}</th></tr></thead>
      <tbody>${linhas.map(l => `<tr><td class="tec">${l.t.cor ? `<span class="avatar" style="background:${l.t.cor};width:22px;height:22px;font-size:9px">${esc(iniciais(l.t.nome))}</span>` : ''}${esc(l.t.nome)}</td>${l.meses.map(cel).join('')}<td class="tot">${l.total}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td class="tec">Total</td>${porMes.map(cel).join('')}<td class="tot">${doAno.length}</td></tr></tfoot>
    </table></div>` : `<p class="vazio" style="padding:10px">Nenhum plantão registrado em ${ano}.</p>`}
  </section>`;
}

function abrirDiaPlantao(dia) {
  const atuais = new Set(pl.plantoes.filter(p => p.data === dia).map(p => p.tecId));
  const opcoes = [...db.tecnicos.filter(t => t.ativo !== false || atuais.has(t.id)), ...Object.values(pl.extras).filter(t => atuais.has(t.id))].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  if (!opcoes.length) { avisar('Cadastre os técnicos na aba Técnicos primeiro.', 'Escala de plantões'); return; }
  const corpo = `<p style="margin:0 0 10px;color:var(--cinza)">Quem fica de plantão neste dia?</p>
    <div class="chips" id="plEscolha">${opcoes.map(t => { const aus = !t.extra && ausenciaDe(t.id, dia); // feriado não impede plantão
    const ausInfo = aus && aus.tipo !== 'feriado' ? aus : null; return `<label class="chip" style="--cor:${t.cor || 'var(--azul2)'}"><input type="checkbox" value="${esc(t.id)}" ${atuais.has(t.id) ? 'checked' : ''}>${t.cor ? `<span class="avatar" style="background:${t.cor};width:22px;height:22px;font-size:9px">${esc(iniciais(t.nome))}</span>` : ''}${esc(t.nome)}${ausInfo ? ` <small style="color:var(--vermelho)">(${esc(nomeAusencia(ausInfo).toLowerCase())})</small>` : ''}</label>`; }).join('')}</div>
    <div class="campo" style="margin-top:14px"><label for="plVeic">Veículo do plantão (placa)</label>
      ${htmlCampoVeiculo('plVeic', veiculoPlantao(dia))}
      <small>Aparece só na agenda e no celular dos técnicos. O site dos clientes não mostra.</small></div>
    <div id="plVeicAviso"></div>`;
  const w = abrirModal({
    titulo: `Plantão · ${DIAS[diaSemana(dia)]}, ${fmtData(dia)}`, corpo, largura: 600, botoes: [
      { texto: 'Cancelar', acao: (w, f) => f() },
      { texto: 'Confirmar', classe: 'btn-prim', acao: (w, f) => {
        const ids = $$('#plEscolha input:checked', w).map(i => i.value);
        const antes = JSON.stringify(pl.plantoes.filter(p => p.data === dia).map(p => p.tecId).sort());
        pl.plantoes = pl.plantoes.filter(p => p.data !== dia).concat(ids.map(id => ({ data: dia, tecId: id })));
        // Sem ninguém de plantão, o carro do dia também sai
        const placa = ids.length ? lerCampoVeiculo(w, 'plVeic') : '';
        if (placa !== veiculoPlantao(dia)) definirVeiculoPlantao(dia, placa);
        f();
        if (antes !== JSON.stringify(ids.slice().sort())) alterouEscala(); else render();
      } }
    ]
  });
  // Avisa se o carro já está numa tarefa desse dia
  const avisarVeic = () => {
    const placa = lerCampoVeiculo(w, 'plVeic');
    const usos = placa ? db.tarefas.filter(t => ativa(t) && t.data === dia && (t.veiculo || '').toUpperCase() === placa) : [];
    $('#plVeicAviso', w).innerHTML = usos.length ? `<div class="info-box" style="margin-top:8px;background:var(--amarelo-claro);color:#6B4E00">⚠ ${esc(placa)} também está em ${usos.map(t => `${esc(nomeCliente(cliente(t.clienteId)))} (${t.inicio}–${min2hm(fimMin(t))})`).join(', ')}.</div>` : '';
  };
  w.addEventListener('input', avisarVeic); w.addEventListener('change', avisarVeic);
  avisarVeic();
}

/* ======================= 9. EVENTOS ======================= */
const acoes = {

  },
  'nav': el => {
    const p = +el.dataset.passo;
    if (ui.visao === 'dia') { ui.dia = addDias(ui.dia, p); ui.semana = segundaDe(ui.dia); }
    else if (ui.visao === 'mes') { ui.dia = addMeses(ui.dia.slice(0, 8) + '01', p); ui.semana = segundaDe(ui.dia); }
    else { ui.semana = addDias(ui.semana, 7 * p); ui.dia = addDias(ui.dia, 7 * p); }
    render();
  },
  'nav-hoje': () => { ui.dia = hoje(); ui.semana = segundaDe(hoje()); render(); },
  'ir-dia': el => { ui.dia = el.dataset.dia; ui.semana = segundaDe(ui.dia); ui.visao = 'dia'; salvarUi(); render(); },
  'limpar-filtros': () => { Object.keys(ui.filtros).forEach(k => ui.filtros[k] = ''); render(); },
  'nova-tarefa': el => abrirTarefa(null, { tec: el.dataset.tec || undefined, dia: el.dataset.dia || undefined }),
  'editar-tarefa': el => abrirTarefa(el.dataset.id),
  'nova-ausencia': el => abrirAusencia(null, { tec: el.dataset.tec || undefined, dia: el.dataset.dia || undefined }),
  'editar-ausencia': el => abrirAusencia(el.dataset.id),
  'excluir-ausencia': async el => {
    const a = db.ausencias.find(x => x.id === el.dataset.id); if (!a) return;
    if (!await confirmar(`Excluir ${nomeAusencia(a).toLowerCase()} de ${fmtData(a.inicio)}${a.fim !== a.inicio ? ' a ' + fmtData(a.fim) : ''}?`, { titulo: 'Excluir', ok: 'Excluir', perigo: true })) return;
    db.ausencias = db.ausencias.filter(x => x.id !== a.id); salvar(); render(); toast('Excluído');
  },
  'adicionar-veiculo': () => {
    const inp = $('#novoVeiculo'), placa = inp.value.trim().toUpperCase().replace(/\s+/g, '');
    if (!placa) { inp.focus(); return; }
    if (!db.config.veiculos.includes(placa)) db.config.veiculos.push(placa);
    salvar(); render(); toast(`Veículo ${placa} adicionado`, 'ok'); $('#novoVeiculo')?.focus();
  },
  'remover-veiculo': el => { db.config.veiculos = db.config.veiculos.filter(v => v !== el.dataset.placa); salvar(); render(); toast(`Veículo ${el.dataset.placa} removido da lista`); },
  'novo-cliente': () => abrirCliente(null),
  'editar-cliente': el => abrirCliente(el.dataset.id),
  'excluir-cliente': async el => {
    const c = cliente(el.dataset.id), n = db.tarefas.filter(t => t.clienteId === c.id).length;
    if (!await confirmar(`Excluir <b>${esc(nomeCliente(c))}</b>?${n ? `<br><br>As <b>${n} tarefa(s)</b> deste cliente também serão excluídas.` : ''}`, { titulo: 'Excluir cliente', ok: 'Excluir', perigo: true })) return;
    db.clientes = db.clientes.filter(x => x.id !== c.id); db.tarefas = db.tarefas.filter(t => t.clienteId !== c.id);
    salvar(); render(); toast('Cliente excluído');
  },
  'importar-clientes': () => $('#arqClientes').click(),
  'novo-tecnico': () => abrirTecnico(null),
  'editar-tecnico': el => abrirTecnico(el.dataset.id),
  'excluir-tecnico': async el => {
    const t = tecnico(el.dataset.id), n = db.tarefas.filter(x => x.tecnicoIds.includes(t.id)).length;
    if (!await confirmar(`Excluir <b>${esc(t.nome)}</b>?${n ? `<br><br>Ele será retirado de ${n} tarefa(s); as que ficarem sem ninguém aparecerão como “sem técnico”. Se ele só saiu da equipe, prefira marcar como <b>inativo</b>.` : ''}`, { titulo: 'Excluir técnico', ok: 'Excluir', perigo: true })) return;
    db.tecnicos = db.tecnicos.filter(x => x.id !== t.id);
    db.tarefas.forEach(x => { x.tecnicoIds = x.tecnicoIds.filter(id => id !== t.id); if (x.rdv) delete x.rdv[t.id]; });
    db.ausencias = db.ausencias.filter(a => a.todos || a.tecnicoIds.some(id => id !== t.id)).map(a => ({ ...a, tecnicoIds: a.tecnicoIds.filter(id => id !== t.id) }));
    if (ui.filtros.tecnico === t.id) ui.filtros.tecnico = '';
    salvar(); render(); toast('Técnico excluído');
  },
  'duplicar-semana': async () => {
    const dias = diasDaSemana();
    const origem = db.tarefas.filter(t => t.data >= ui.semana && t.data <= addDias(ui.semana, 6) && t.status !== 'cancelada');
    if (!origem.length) { avisar('Esta semana não tem tarefas para duplicar.'); return; }
    const prox = addDias(ui.semana, 7);
    const jaTem = db.tarefas.filter(t => t.data >= prox && t.data <= addDias(prox, 6)).length;
    if (!await confirmar(`Copiar <b>${origem.length} tarefa(s)</b> desta semana para a semana de <b>${fmtData(prox)}</b>?<br><br>As cópias ficam com status “Agendada” e sem nº do Auvo. Filtros não se aplicam: todas as tarefas não canceladas são copiadas.${jaTem ? `<br><br><b>Atenção:</b> a próxima semana já tem ${jaTem} tarefa(s); elas serão mantidas.` : ''}`, { titulo: 'Duplicar semana', ok: `Duplicar ${origem.length} tarefa(s)` })) return;
    origem.forEach(t => db.tarefas.push({ ...t, id: uid(), tecnicoIds: [...t.tecnicoIds], rdv: { ...(t.rdv || {}) }, data: addDias(t.data, 7), status: 'agendada', auvo: '', recorrencia: undefined }));
    salvar(); ui.semana = prox; ui.dia = addDias(ui.dia, 7); render();
    toast(`${origem.length} tarefa(s) copiadas para a semana ${semanaISO(prox)}`, 'ok');
  },
  'ajustar-inicio': async () => {
    const lista = tarefasAntesDoExpediente(tarefasDaSemana());
    if (!lista.length) return;
    if (!await confirmar(`Ajustar <b>${lista.length} tarefa(s)</b> desta semana para começar no horário do dia (${nomesDiasExcecao()})? O horário de término continua o mesmo.`, { titulo: 'Ajustar início', ok: 'Ajustar' })) return;
    lista.forEach(t => { const novo = periodosDoDia(t.data).manhaIni, fim = fimMin(t); t.inicio = novo; t.duracaoMin = fim - hm2min(novo); });
    salvar(); render(); toast(`${lista.length} tarefa(s) ajustadas`, 'ok');
  },
  'pl-dia': el => abrirDiaPlantao(el.dataset.dia),
  'pl-mes': el => { const p = +el.dataset.passo; pl.mes = p ? addMeses(pl.mes, p) : hoje().slice(0, 8) + '01'; render(); },
  'pl-ano': el => { pl.ano = (pl.ano || +hoje().slice(0, 4)) + +el.dataset.passo; render(); },
  'pl-ir-mes': el => { pl.mes = el.dataset.mes; render(); $('.pl-grade')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); },
  'pl-recarregar': () => { pl.estado = 'nao-carregado'; render(); },
  'publicar': el => publicarTecnicos(el),
  'conectar-nuvem': () => abrirConectarNuvem(),
  'sincronizar': async () => { if (nuvem.pendente) await enviarNuvem(); else await buscarNuvem(false); if (nuvem.estado === 'ok') toast('Agenda sincronizada', 'ok'); },
  'desconectar-nuvem': async () => {
    if (!await confirmar('Desconectar este computador da agenda na nuvem?<br><br>A agenda continua na nuvem para as outras pessoas. Aqui fica a última cópia, sem sincronizar.', { titulo: 'Desconectar', ok: 'Desconectar' })) return;
    if (nuvem.pendente) await enviarNuvem();
    desconectarNuvem(); render(); toast('Computador desconectado da nuvem');
  },
  'acesso-gh': () => abrirAcessoGh(),
  'apresentacao': () => abrirApresentacao(),
  'ap-mover': el => moverSlide(+el.dataset.passo),
  'ap-modo': el => { apres.i = 0; abrirApresentacao(el.dataset.modo); },
  'ap-sair': () => fecharApresentacao(),
  'pdf': () => { renderImpressao(); window.print(); },
  'csv': () => exportarCSV(),
  'backup': () => exportarBackup(),
  'restaurar': () => $('#arqBackup').click(),
  'recarregar-auvo': () => { const n = adicionarClientesAuvo(); salvar(); render(); toast(n ? `${n} cliente(s) do Auvo adicionados` : 'Todos os clientes do Auvo já estão cadastrados', n ? 'ok' : ''); },
  'recarregar-tecnicos': () => { const n = adicionarTecnicosAuvo(); salvar(); render(); toast(n ? `${n} técnico(s) do Auvo adicionados` : 'Todos os técnicos do Auvo já estão cadastrados', n ? 'ok' : ''); },
  'novo-tipo': () => { db.config.tipos.push({ id: uid(), nome: 'Novo tipo', cor: '#7A8594' }); salvar(); render(); const ins = $$('[data-tipo-nome]'); ins[ins.length - 1]?.select(); },
  'excluir-tipo': async el => {
    const t = tipo(el.dataset.id);
    if (!await confirmar(`Excluir o tipo <b>${esc(t.nome)}</b>?`, { titulo: 'Excluir tipo', ok: 'Excluir', perigo: true })) return;
    db.config.tipos = db.config.tipos.filter(x => x.id !== t.id); salvar(); render();
  },
  'apagar-tudo': async () => {
    if (!await confirmar(`Apagar <b>todos</b> os clientes, técnicos, tarefas e configurações deste navegador?${nuvem.ativa ? '<br><br>Este computador será <b>desconectado</b> da nuvem antes; a agenda da nuvem não é apagada.' : ''}<br><br>Recomendado: exporte um backup antes. Esta ação não pode ser desfeita.`, { titulo: 'Apagar todos os dados', ok: 'Apagar tudo', perigo: true })) return;
    if (nuvem.ativa) desconectarNuvem();
    db = dbVazio(); db.meta.clientesAuvoCarregados = true; db.meta.tecnicosAuvoCarregados = true; db.meta.tecnicosAuvoVistos = TECNICOS_AUVO.map(t => t.codigoAuvo); tirarInstantaneo(); salvar(); render(); toast('Todos os dados foram apagados');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-acao]');
  if (!el || el.disabled) return;
  // Modais têm seus próprios botões; no modo apresentação os cartões não abrem edição
  if (el.closest('.modal')) return;
  if (el.closest('#apresentacao') && ['editar-tarefa', 'editar-ausencia'].includes(el.dataset.acao)) return;
  const fn = acoes[el.dataset.acao];
  if (fn) { e.preventDefault(); fn(el); }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-filtro]')) { ui.filtros[el.dataset.filtro] = el.value; render(); }
  else if (el.id === 'seletorData' && el.value) { ui.dia = el.value; ui.semana = segundaDe(el.value); render(); }
  else if (el.id === 'filtroSituacao') { ui.filtroSituacao = el.value; render(); }
  else if (el.matches('[data-cfg]')) {
    const k = el.dataset.cfg;
    if (el.type === 'checkbox') db.config[k] = el.checked;
    else if (k === 'limiteHorasDia') db.config[k] = Math.min(24, Math.max(1, parseFloat(el.value) || 8));
    else if (el.value) db.config[k] = el.value;
    salvar(); render(); toast('Configuração salva');
  }
  else if (el.matches('[data-pl-cfg]')) {
    const k = el.dataset.plCfg;
    pl.config[k] = k === 'suporteTelefone' ? foneEscala(el.value) : el.value.trim();
    alterouEscala();
  }
  else if (el.matches('[data-inicio-dia]') && el.value) {
    const m = db.config.periodos.manhaIniDia ||= {};
    if (el.value === db.config.periodos.manhaIni) delete m[el.dataset.inicioDia]; else m[el.dataset.inicioDia] = el.value;
    salvar(); render(); toast('Início da manhã salvo');
  }
  else if (el.matches('[data-periodo]') && el.value) { db.config.periodos[el.dataset.periodo] = el.value; salvar(); render(); toast('Período salvo'); }
  else if (el.matches('[data-tipo-cor]')) { tipo(el.dataset.tipoCor).cor = el.value; salvar(); render(); }
  else if (el.matches('[data-tipo-nome]')) { const t = db.config.tipos.find(x => x.id === el.dataset.tipoNome); if (t && el.value.trim()) { t.nome = el.value.trim(); salvar(); render(); } }
  else if (el.id === 'arqBackup' && el.files[0]) { importarBackup(el.files[0]); el.value = ''; }
  else if (el.id === 'arqClientes' && el.files[0]) { importarClientes(el.files[0]); el.value = ''; }
});

// Busca de clientes sem perder o foco do campo
document.addEventListener('input', e => {
  if (e.target.id !== 'buscaClientes') return;
  ui.buscaClientes = e.target.value;
  const pos = e.target.selectionStart;
  render();
  const inp = $('#buscaClientes'); inp.focus(); inp.setSelectionRange(pos, pos);
});

// Arrastar e soltar: muda o dia e/ou o técnico da tarefa
let arrasto = null;
document.addEventListener('dragstart', e => {
  const card = e.target.closest?.('.tcard[draggable="true"], .mtarefa[draggable="true"]'); if (!card) return;
  arrasto = { id: card.dataset.id, de: card.dataset.tec }; // no mês não há técnico na célula: só muda o dia
  if (mesPop && mesPop.contains(card)) mesPop.classList.add('soltando'); // o cartão do "+N" some enquanto arrasta
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', card.dataset.id);
  setTimeout(() => card.classList.add('arrastando'), 0);
});
document.addEventListener('dragend', () => { $$('.arrastando, .sobre').forEach(x => x.classList.remove('arrastando', 'sobre')); arrasto = null; esconderTarefasDoDia(true); });
document.addEventListener('dragover', e => {
  const alvo = e.target.closest('[data-drop-dia]'); if (!alvo || !arrasto) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  $$('.sobre').forEach(x => x !== alvo && x.classList.remove('sobre'));
  alvo.classList.add('sobre');
});
document.addEventListener('drop', e => {
  const alvo = e.target.closest('[data-drop-dia]'); if (!alvo || !arrasto) return;
  e.preventDefault();
  const t = tarefa(arrasto.id); if (!t) return;
  const paraTec = alvo.dataset.dropTec, paraDia = alvo.dataset.dropDia, de = arrasto.de;
  if (t.data === paraDia && de === paraTec) return;
  ajustarInicioAoDia(t, t.data, paraDia);
  t.data = paraDia;
  if (de !== paraTec) {
    const ids = t.tecnicoIds.filter(id => id !== de);
    if (paraTec && !ids.includes(paraTec)) ids.push(paraTec);
    t.tecnicoIds = ids;
    // O RDV acompanha a troca de técnico
    t.rdv ||= {};
    if (de && t.rdv[de] != null) { if (paraTec && t.rdv[paraTec] == null) t.rdv[paraTec] = t.rdv[de]; delete t.rdv[de]; }
  }
  salvar(); esconderTarefasDoDia(true); render();
  toast(`Tarefa movida para ${DIAS_CURTOS[diaSemana(paraDia)]} ${fmtDataCurta(paraDia)}${paraTec ? ' · ' + tecnico(paraTec).nome : ''}`, 'ok');
});

// Teclado: Esc fecha modal; setas navegam na apresentação; Enter adiciona placa
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'novoVeiculo') { e.preventDefault(); acoes['adicionar-veiculo'](); return; }
  if (!$('#apresentacao').hidden) {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); moverSlide(1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); moverSlide(-1); }
    else if (e.key === 'Escape') fecharApresentacao();
    return;
  }
  if (e.key === 'Escape') { const m = $$('.modal-fundo').pop(); if (m) m._fechar(); }
});
// Sair da tela cheia (Esc do navegador) também encerra a apresentação
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && !$('#apresentacao').hidden) $('#apresentacao').hidden = true; });
window.addEventListener('beforeprint', renderImpressao);
// Outra aba alterou os dados: recarrega para não sobrescrever
window.addEventListener('storage', e => { if (e.key === CHAVE_DADOS) { db = carregarDb(); tirarInstantaneo(); render(); toast('Dados atualizados por outra aba'); } });

/* ======================= INÍCIO ======================= */
tirarInstantaneo();
removerExemplosAntigos();
preCarregarClientes();
render();
setTimeout(atualizarPaginasDaVersao, 800);
iniciarNuvem().finally(() => { setTimeout(atualizarPaginasAoAbrir, 1500); if (accRaiz() && pl.estado === 'nao-carregado') carregarEscala(); });
</script>
</body>
</html>
