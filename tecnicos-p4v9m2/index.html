<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Minha Agenda | Redefrigor</title>
<style>
/* Página somente leitura para os técnicos (celular). Gerada pela Agenda Semanal Redefrigor. */
:root {
  --navy: #003E78; --azul: #0765B9; --azul2: #0056A4; --azul-claro: #DCE7F1;
  --verde: #00A428; --verde-claro: #E3F5E8; --vermelho: #D32F2F; --vermelho-claro: #FDECEC;
  --amarelo: #F3B119; --amarelo-claro: #FFF6DF; --fundo: #F4F6F8; --cinza: #7A8594;
  --texto: #1E2A38; --borda: #E3E8EF; --sombra: 0 1px 2px rgba(0,30,60,.05), 0 4px 14px rgba(0,30,60,.07);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: var(--fundo); color: var(--texto); font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
a { color: var(--azul2); }

.topo { background: linear-gradient(100deg, var(--navy), var(--azul)); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 14px; position: sticky; top: 0; z-index: 10; }
.topo-linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 720px; margin: 0 auto; }
.topo img { height: 22px; display: block; }
.pill { border: 1px solid rgba(255,255,255,.55); border-radius: 999px; padding: 3px 10px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.quem { display: flex; align-items: center; gap: 10px; max-width: 720px; margin: 12px auto 0; }
.quem .nome { font-weight: bold; font-size: 17px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quem button { background: rgba(255,255,255,.15); border: 0; color: #fff; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: bold; cursor: pointer; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-weight: bold; font-size: 13px; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,.7); }

main { max-width: 720px; margin: 0 auto; padding: 14px 16px calc(32px + env(safe-area-inset-bottom)); }
.nav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.nav button { border: 0; background: #fff; box-shadow: var(--sombra); border-radius: 12px; height: 42px; min-width: 42px; font-weight: bold; color: var(--navy); cursor: pointer; }
.nav button svg { width: 18px; height: 18px; vertical-align: middle; }
.nav .titulo { flex: 1; text-align: center; font-weight: bold; color: var(--navy); font-size: 14px; }
.nav .titulo small { display: block; color: var(--cinza); font-weight: normal; font-size: 12px; }
.nav .hoje-btn { padding: 0 14px; }

.resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.resumo div { background: #fff; border-radius: 12px; box-shadow: var(--sombra); padding: 10px 12px; }
.resumo small { display: block; color: var(--cinza); font-size: 11.5px; }
.resumo b { font-size: 18px; white-space: nowrap; }
.resumo .rdv b { color: #00731C; }

.dia { margin-bottom: 14px; scroll-margin-top: calc(120px + env(safe-area-inset-top)); }
.dia-cab { display: flex; align-items: center; gap: 8px; margin: 0 2px 8px; }
.dia-cab h2 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
.dia-cab h2::before { content: ''; width: 4px; height: 16px; border-radius: 2px; background: var(--verde); }
.dia-cab .tag-hoje { background: var(--verde); color: #fff; font-size: 11px; font-weight: bold; border-radius: 999px; padding: 2px 8px; }
.dia-cab .horas { margin-left: auto; color: var(--cinza); font-size: 12.5px; }
.vazio-dia { background: #fff; border-radius: 12px; padding: 12px 14px; color: var(--cinza); font-size: 13.5px; box-shadow: var(--sombra); }

.aus { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 10px 12px; font-weight: bold; font-size: 13.5px; margin-bottom: 8px; }
.aus svg { width: 18px; height: 18px; flex: none; }
.aus small { display: block; font-weight: normal; }
.aus-folga { background: #E3E8EF; color: #44505F; }
.aus-ferias { background: #EAE3F7; color: #5B3A9E; }
.aus-feriado { background: var(--amarelo-claro); color: #7A5600; }

.tarefa { background: #fff; border-radius: 14px; box-shadow: var(--sombra); padding: 12px 14px; margin-bottom: 8px; border-left: 5px solid var(--cor, var(--azul2)); }
.tarefa.cancelada { opacity: .6; }
.tarefa.cancelada .cli { text-decoration: line-through; }
.tarefa.urgente { box-shadow: var(--sombra), inset 0 0 0 1.5px var(--vermelho); }
.t-hora { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--navy); font-weight: bold; }
.t-hora .per { color: var(--verde); }
.t-hora > span:last-child { color: var(--cinza); font-weight: normal; }
.cli { font-weight: bold; font-size: 16.5px; margin: 4px 0 2px; line-height: 1.25; }
.loja { color: #44505F; font-size: 13.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 4px; }
.tag { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: bold; }
.st-agendada { background: var(--azul-claro); color: var(--navy); }
.st-andamento { background: var(--amarelo-claro); color: #7A5600; }
.st-concluida { background: var(--verde-claro); color: #00731C; }
.st-reagendada { background: #ECEFF3; color: #4F5B69; }
.st-cancelada { background: var(--vermelho-claro); color: var(--vermelho); }
.pr-urgente { background: var(--vermelho); color: #fff; }
.pr-alta { background: var(--amarelo-claro); color: #7A5600; box-shadow: inset 0 0 0 1px var(--amarelo); }
.servico { background: var(--fundo); border-radius: 10px; padding: 8px 10px; margin-top: 8px; font-size: 14px; white-space: pre-wrap; }
.infos { display: grid; gap: 6px; margin-top: 10px; font-size: 14px; }
.info { display: flex; gap: 8px; align-items: flex-start; }
.info svg { width: 17px; height: 17px; flex: none; color: var(--azul2); margin-top: 1px; }
.info b { font-weight: bold; }
.info.rdv { color: #00731C; font-weight: bold; }
.info.rdv svg { color: #00731C; }
.acoes { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.acoes a { flex: 1; min-width: 120px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; background: var(--azul-claro); color: var(--navy); font-weight: bold; font-size: 13.5px; border-radius: 10px; padding: 10px 12px; }
.acoes a svg { width: 16px; height: 16px; }

.escolha h1 { font-size: 20px; color: var(--navy); margin: 6px 0 4px; }
.escolha p { color: var(--cinza); margin: 0 0 14px; font-size: 14px; }
.lista-tec { display: grid; gap: 8px; }
.lista-tec button { display: flex; align-items: center; gap: 12px; width: 100%; background: #fff; border: 0; border-radius: 14px; box-shadow: var(--sombra); padding: 12px 14px; font-size: 16px; font-weight: bold; text-align: left; cursor: pointer; }
.lista-tec .avatar { box-shadow: none; }
.aviso { background: #fff; border-radius: 14px; box-shadow: var(--sombra); padding: 18px; text-align: center; color: var(--cinza); }
.rodape { text-align: center; color: var(--cinza); font-size: 12px; margin-top: 18px; }
.carregando { text-align: center; color: var(--cinza); padding: 40px 0; }

/* Abas Minha agenda / Plantões */
.abas { display: flex; gap: 4px; background: #E6ECF3; border-radius: 12px; padding: 4px; margin-bottom: 12px; }
.abas button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 9px 6px; font-weight: bold; font-size: 14px; color: var(--cinza); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.abas button svg { width: 16px; height: 16px; }
.abas button[aria-selected="true"] { background: #fff; color: var(--navy); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.abas .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--verde); }

/* Plantão na agenda */
.plantao-dia { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 9px 12px; margin-bottom: 8px; font-size: 13.5px; background: var(--azul-claro); color: var(--navy); }
.plantao-dia svg { width: 18px; height: 18px; flex: none; }
.plantao-dia.meu { background: var(--verde); color: #fff; font-weight: bold; }
.plantao-dia small { display: block; font-weight: normal; opacity: .9; }

/* Aba Plantões */
.pl-hoje { background: linear-gradient(135deg, var(--azul2), var(--navy)); color: #fff; border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: var(--sombra); }
.pl-hoje small { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; opacity: .85; font-weight: bold; }
.pl-hoje .nome { font-size: 20px; font-weight: bold; margin: 4px 0 2px; }
.pl-hoje .sub { font-size: 13px; opacity: .9; }
.pl-hoje .acoes a { background: #fff; color: var(--navy); }
.pl-hoje .acoes a.wa { background: #25D366; color: #fff; }
.pl-titulo { font-size: 15px; margin: 4px 2px 8px; display: flex; align-items: center; gap: 8px; }
.pl-titulo::before { content: ''; width: 4px; height: 16px; border-radius: 2px; background: var(--verde); }
.pl-item { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 12px; box-shadow: var(--sombra); padding: 10px 12px; margin-bottom: 8px; }
.pl-item.meu { box-shadow: var(--sombra), inset 0 0 0 2px var(--verde); }
.pl-data { width: 48px; flex: none; text-align: center; border-radius: 10px; background: var(--azul-claro); color: var(--navy); padding: 6px 0; line-height: 1.1; }
.pl-data b { display: block; font-size: 18px; }
.pl-data span { font-size: 10.5px; font-weight: bold; text-transform: uppercase; }
.pl-item.meu .pl-data { background: var(--verde); color: #fff; }
.pl-info { flex: 1; min-width: 0; }
.pl-info b { display: block; }
.pl-info span { font-size: 12.5px; color: var(--cinza); }
.pl-acoes { display: flex; gap: 6px; }
.pl-acoes a { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--azul-claro); color: var(--navy); }
.pl-acoes a.wa { background: #E3F9EB; color: #128C4A; }
.pl-acoes svg { width: 17px; height: 17px; }
.link-site { display: block; text-align: center; background: #fff; border-radius: 12px; box-shadow: var(--sombra); padding: 12px; font-weight: bold; text-decoration: none; margin-top: 6px; }
</style>
</head>

  if (/\.html?$/i.test(partes[partes.length - 1])) partes.pop();
  const [repo, ...pasta] = partes;
  return `https://api.github.com/repos/${h.replace('.github.io', '')}/${repo}/contents/${[...(naRaiz ? [] : pasta), arquivo].join('/')}`;
}
async function lerJson(naRaiz, arquivo, local) {
  const api = urlApi(naRaiz, arquivo);
  if (api) {
    try {
      const r = await fetch(api, { cache: 'no-cache' });
      if (r.ok) {
        const arq = await r.json();
        const bin = atob(arq.content.replace(/\s/g, ''));
        return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
      }
    } catch (e) { console.warn('API do GitHub indisponível, usando o arquivo do site', e); }
  }
  const r = await fetch(local + '?v=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const carregar = () => lerJson(false, 'dados.json', 'dados.json');
// Escala de plantões: escala.json na raiz do site (o mesmo do site de plantões)
const carregarPlantao = () => lerJson(true, 'escala.json', '../escala.json').catch(e => { console.warn('Escala de plantões indisponível', e); return null; });

// Liga o técnico da agenda ao técnico da escala de plantões pelo nome
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
function plantoesDetalhados() {
  if (!plantao || !Array.isArray(plantao.plantoes)) return [];
  const porId = Object.fromEntries((plantao.tecnicos || []).map(t => [t.id, t]));
  return plantao.plantoes.map(p => ({ data: p.data, tec: porId[p.tecnicoId] })).filter(p => p.tec).sort((a, b) => a.data.localeCompare(b.data));
}
const ehEu = tecEscala => !!(eu && tecnico(eu) && norm(tecEscala.nome) === norm(tecnico(eu).nome));
const plantaoNoDia = d => plantoesDetalhados().filter(p => p.data === d);
const soDigitos = s => String(s || '').replace(/\D/g, '');
const fmtTel = t => { const d = soDigitos(t); return d.length >= 12 ? `(${d.slice(2, 4)}) ${d.slice(4, d.length - 4)}-${d.slice(-4)}` : t || ''; };
const horarioPlantao = () => plantao?.config?.horario || '';

const tecnico = id => dados.tecnicos.find(t => t.id === id);
const tipo = id => dados.tipos.find(t => t.id === id) || { nome: id, cor: '#7A8594' };
const ausencia = (tecId, data) => dados.ausencias.find(a => data >= a.inicio && data <= a.fim && (a.todos || a.tecnicoIds.includes(tecId)));
const corTexto = hex => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; const l = (0.299 * r + 0.587 * g + 0.114 * b) / 255; const f = l > 0.6 ? 0.42 : l > 0.45 ? 0.62 : 0.85; return `rgb(${Math.round(r * f)},${Math.round(g * f)},${Math.round(b * f)})`; };
const corFundo = hex => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},.16)`; };
const NOMES_STATUS = { agendada: 'Agendada', andamento: 'Em andamento', concluida: '✓ Concluída', reagendada: 'Reagendada', cancelada: 'Cancelada' };
const NOMES_AUS = { folga: 'Folga', ferias: 'Férias', feriado: 'Feriado' };

function renderQuem() {
  const t = eu && tecnico(eu), q = $('#quem');
  if (!t) { q.hidden = true; return; }
  q.hidden = false;
  q.innerHTML = `<span class="avatar" style="background:${t.cor}">${esc(iniciais(t.nome))}</span><span class="nome">${esc(t.nome)}</span><button type="button" id="trocar">Trocar</button>`;
  $('#trocar').onclick = () => { eu = null; try { localStorage.removeItem(CHAVE_EU); } catch (e) { } render(); };
}

function renderEscolha() {
  $('#conteudo').innerHTML = `<section class="escolha"><h1>Quem é você?</h1><p>Escolha seu nome para ver sua agenda. Este aparelho vai lembrar da escolha.</p>
    <div class="lista-tec">${dados.tecnicos.map(t => `<button type="button" data-id="${esc(t.id)}"><span class="avatar" style="background:${t.cor}">${esc(iniciais(t.nome))}</span>${esc(t.nome)}</button>`).join('')}</div></section>
    <p class="rodape">Somente leitura · alterações são feitas pelo administrador.</p>`;
  document.querySelectorAll('.lista-tec button').forEach(b => b.onclick = () => {
    eu = b.dataset.id; try { localStorage.setItem(CHAVE_EU, eu); } catch (e) { }
    semana = segundaDe(hoje()); render(true);
  });
}

function cartao(t) {
  const tp = tipo(t.tipo), c = t.cliente || {};
  const outros = t.tecnicoIds.filter(id => id !== eu).map(id => tecnico(id)?.nome).filter(Boolean);
  const rdv = +(t.rdv || {})[eu] || 0;
  const tel = String(c.telefone || '').split(/[;/]/)[0].replace(/[^\d+]/g, '');
  const mapa = c.endereco ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.endereco)}` : '';
  return `<article class="tarefa ${t.status === 'cancelada' ? 'cancelada' : ''} ${t.prioridade === 'urgente' ? 'urgente' : ''}" style="--cor:${tp.cor}">
    <div class="t-hora"><span><span class="per">${esc(t.periodo)}</span> · ${t.inicio}–${t.fim}</span><span>${fmtDur(t.trabalho)} h${t.desloc ? ` + ${fmtDur(t.desloc)} desloc.` : ''}</span></div>
    <div class="cli">${esc(c.nome || '')}</div>
    ${c.loja || c.cidade ? `<div class="loja">${esc([c.loja, c.cidade].filter(Boolean).join(' · '))}</div>` : ''}
    <div class="tags">
      <span class="tag" style="background:${corFundo(tp.cor)};color:${corTexto(tp.cor)}">${esc(tp.nome)}</span>
      <span class="tag st-${t.status}">${NOMES_STATUS[t.status] || esc(t.status)}</span>
      ${t.prioridade === 'urgente' ? '<span class="tag pr-urgente">URGENTE</span>' : t.prioridade === 'alta' ? '<span class="tag pr-alta">Alta</span>' : ''}
    </div>
    ${t.descricao ? `<div class="servico">${esc(t.descricao)}</div>` : ''}
    <div class="infos">
      ${outros.length ? `<div class="info">${ICO.pessoas}<span>Com <b>${esc(outros.join(', '))}</b></span></div>` : ''}
      ${t.veiculo ? `<div class="info">${ICO.veiculo}<span>Veículo <b>${esc(t.veiculo)}</b></span></div>` : ''}
      ${rdv ? `<div class="info rdv">${ICO.moeda}<span>RDV ${fmtBRL(rdv)}</span></div>` : ''}
      ${c.endereco ? `<div class="info">${ICO.local}<span>${esc(c.endereco)}</span></div>` : ''}
      ${c.contato ? `<div class="info">${ICO.pessoas}<span>Falar com ${esc(c.contato)}</span></div>` : ''}
      ${t.auvo ? `<div class="info">${ICO.doc}<span>Tarefa no Auvo nº ${esc(t.auvo)}</span></div>` : ''}
    </div>
    ${mapa || tel ? `<div class="acoes">${mapa ? `<a href="${mapa}" target="_blank" rel="noopener">${ICO.local} Abrir no mapa</a>` : ''}${tel ? `<a href="tel:${esc(tel)}">${ICO.tel} Ligar</a>` : ''}</div>` : ''}
  </article>`;
}

function htmlAbas() {
  if (!plantao) return '';
  const hojeEu = plantaoNoDia(hoje()).some(p => ehEu(p.tec));
  return `<div class="abas" role="tablist">
    <button type="button" role="tab" data-aba="agenda" aria-selected="${aba === 'agenda'}">${ICO.agenda} Minha agenda</button>
    <button type="button" role="tab" data-aba="plantoes" aria-selected="${aba === 'plantoes'}">${ICO.escudo} Plantões${hojeEu ? '<span class="ponto" title="Você está de plantão hoje"></span>' : ''}</button>
  </div>`;
}
function ligarAbas() {
  document.querySelectorAll('.abas [data-aba]').forEach(b => b.onclick = () => { aba = b.dataset.aba; render(aba === 'agenda'); scrollTo(0, 0); });
}

// Aba Plantões: quem está hoje, meus próximos plantões e a escala completa
function renderPlantoes() {
  const hj = hoje(), todos = plantoesDetalhados();
  const deHoje = todos.filter(p => p.data === hj);
  const futuros = todos.filter(p => p.data >= hj);
  const meus = futuros.filter(p => ehEu(p.tec));
  const horario = horarioPlantao();
  const acoes = t => { const d = soDigitos(t.telefone); return d ? `<a href="tel:+${d}" aria-label="Ligar para ${esc(t.nome)}">${ICO.tel}</a><a class="wa" href="https://wa.me/${d}" target="_blank" rel="noopener" aria-label="WhatsApp de ${esc(t.nome)}">${ICO.whats}</a>` : ''; };
  const item = p => { const d = dataDe(p.data); return `<div class="pl-item ${ehEu(p.tec) ? 'meu' : ''}"><div class="pl-data"><b>${d.getDate()}</b><span>${['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'][d.getMonth()]}</span></div>
    <div class="pl-info"><b>${esc(p.tec.nome)}${ehEu(p.tec) ? ' (você)' : ''}</b><span>${DIAS[d.getDay()]}${p.data === hj ? ' · hoje' : ''} · ${esc(fmtTel(p.tec.telefone))}</span></div>
    <div class="pl-acoes">${ehEu(p.tec) ? '' : acoes(p.tec)}</div></div>`; };
  let h = htmlAbas();
  if (deHoje.length) {
    h += deHoje.map(p => { const d = soDigitos(p.tec.telefone); return `<div class="pl-hoje"><small>Plantão hoje${horario ? ' · ' + esc(horario) : ''}</small>
      <div class="nome">${esc(p.tec.nome)}${ehEu(p.tec) ? ' — é você!' : ''}</div><div class="sub">${esc(plantao.config?.cidade || '')}${d ? ' · ' + esc(fmtTel(p.tec.telefone)) : ''}</div>
      ${d && !ehEu(p.tec) ? `<div class="acoes"><a href="tel:+${d}">${ICO.tel} Ligar</a><a class="wa" href="https://wa.me/${d}" target="_blank" rel="noopener">${ICO.whats} WhatsApp</a></div>` : ''}</div>`; }).join('');
  } else {
    h += `<div class="aviso" style="margin-bottom:14px">Hoje não há plantão escalado.</div>`;
  }
  h += `<h2 class="pl-titulo">Meus próximos plantões</h2>`;
  h += meus.length ? meus.slice(0, 6).map(item).join('') : '<div class="vazio-dia" style="margin-bottom:8px">Nenhum plantão seu na escala publicada.</div>';
  h += `<h2 class="pl-titulo" style="margin-top:14px">Escala de plantões</h2>`;
  h += futuros.length ? futuros.slice(0, 12).map(item).join('') : '<div class="vazio-dia">Nenhum plantão futuro cadastrado.</div>';
  h += `<a class="link-site" href="../" target="_blank" rel="noopener">Abrir a página de plantões ›</a>`;
  h += `<p class="rodape">Escala mantida no site de plantões · somente leitura</p>`;
  $('#conteudo').innerHTML = h;
  ligarAbas();
}

// Faixa de plantão dentro de cada dia da agenda
function htmlPlantaoDia(d) {
  const lista = plantaoNoDia(d);
  if (!lista.length) return '';
  const meu = lista.some(p => ehEu(p.tec));
  const outros = lista.filter(p => !ehEu(p.tec)).map(p => p.tec.nome);
  const horario = horarioPlantao();
  return meu
    ? `<div class="plantao-dia meu">${ICO.escudo}<span>Você está de plantão${horario ? `<small>${esc(horario)}${outros.length ? ' · com ' + esc(outros.join(', ')) : ''}</small>` : ''}</span></div>`
    : `<div class="plantao-dia">${ICO.escudo}<span>Plantão: <b>${esc(outros.join(', '))}</b>${horario ? `<small>${esc(horario)}</small>` : ''}</span></div>`;
}

function render(rolarHoje) {
  renderQuem();
  if (!eu || !tecnico(eu)) { renderEscolha(); return; }
  if (aba === 'plantoes' && plantao) { renderPlantoes(); return; }
  const domingo = dados.config.mostrarDomingo;
  const dias = Array.from({ length: 7 }, (_, i) => addDias(semana, i));
  const minhas = dados.tarefas.filter(t => t.tecnicoIds.includes(eu));
  const daSemana = minhas.filter(t => t.data >= dias[0] && t.data <= dias[6]);
  const ativas = daSemana.filter(t => t.status !== 'cancelada');
  const horas = ativas.reduce((s, t) => s + t.trabalho, 0);
  const rdv = ativas.reduce((s, t) => s + (+(t.rdv || {})[eu] || 0), 0);
  const foraDoPeriodo = dias[6] < dados.periodo.de || dias[0] > dados.periodo.ate;
  const hj = hoje();

  let h = htmlAbas() + `<div class="nav">
    <button type="button" id="ant" aria-label="Semana anterior">${ICO.esq}</button>
    <div class="titulo">Semana ${semanaISO(semana)}<small>${fmtCurta(dias[0])} a ${fmtData(dias[domingo ? 6 : 5])}</small></div>
    <button type="button" id="prox" aria-label="Próxima semana">${ICO.dir}</button>
    <button type="button" class="hoje-btn" id="hj">Hoje</button>
  </div>`;
  if (foraDoPeriodo) {
    h += `<div class="aviso">A agenda desta semana ainda não foi publicada.<br><br>Publicado: ${fmtData(dados.periodo.de)} a ${fmtData(dados.periodo.ate)}.</div>`;
  } else {
    h += `<div class="resumo"><div><small>Tarefas</small><b>${ativas.length}</b></div><div><small>Horas</small><b>${fmtDur(horas)} h</b></div><div class="rdv"><small>RDV da semana</small><b>${fmtBRL(rdv)}</b></div></div>`;
    dias.forEach(d => {
      const doDia = daSemana.filter(t => t.data === d).sort((a, b) => a.inicio.localeCompare(b.inicio));
      const dow = dataDe(d).getDay();
      if (dow === 0 && !domingo && !doDia.length && !plantaoNoDia(d).length) return;
      const aus = ausencia(eu, d);
      const horasDia = doDia.filter(t => t.status !== 'cancelada').reduce((s, t) => s + t.trabalho, 0);
      h += `<section class="dia" id="d-${d}"><div class="dia-cab"><h2>${DIAS[dow]}, ${fmtCurta(d)}</h2>${d === hj ? '<span class="tag-hoje">Hoje</span>' : ''}${horasDia ? `<span class="horas">${fmtDur(horasDia)} h</span>` : ''}</div>
        ${htmlPlantaoDia(d)}
        ${aus ? `<div class="aus aus-${aus.tipo}">${ICO.aus}<span>${NOMES_AUS[aus.tipo] || esc(aus.tipo)}${aus.obs ? `<small>${esc(aus.obs)}</small>` : ''}</span></div>` : ''}
        ${doDia.length ? doDia.map(cartao).join('') : aus || plantaoNoDia(d).some(p => ehEu(p.tec)) ? '' : '<div class="vazio-dia">Sem tarefas.</div>'}
      </section>`;
    });
  }
  const pub = new Date(dados.publicadoEm);
  h += `<p class="rodape">Atualizado em ${pub.toLocaleDateString('pt-BR')} às ${pub.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} · somente leitura</p>`;
  $('#conteudo').innerHTML = h;
  $('#ant').onclick = () => { semana = addDias(semana, -7); render(); scrollTo(0, 0); };
  $('#prox').onclick = () => { semana = addDias(semana, 7); render(); scrollTo(0, 0); };
  $('#hj').onclick = () => { semana = segundaDe(hj); render(true); };
  ligarAbas();
  if (rolarHoje) { const el = document.getElementById('d-' + hj); if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); }
}

// Agenda e escala de plantões carregam juntas; se a escala falhar, a agenda funciona sem a aba Plantões
Promise.all([carregar(), carregarPlantao()]).then(([d, p]) => {
  if (!d || d.app !== 'agenda-redefrigor-tecnicos') throw new Error('Arquivo de agenda inválido');
  dados = d; plantao = p; render(true);
}).catch(e => {
  console.error(e);
  $('#conteudo').innerHTML = '<div class="aviso">Não foi possível carregar a agenda.<br>Verifique a internet e tente de novo em instantes.</div>';
});
</script>
</body>
</html>
